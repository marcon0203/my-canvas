# 跑模型：装配 Rig agent 与各条链路的编排。
[package]
name = "studio-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rig = "0.42"
# 流式要 StreamExt::next。rig 的 StreamingResult 就是个 futures::Stream
futures = "0.3"
schemars = "1.2.2"
studio-error = { path = "../error" }
studio-conf = { path = "../conf" }
studio-doc = { path = "../doc" }
studio-skill = { path = "../skill" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
