# Tauri 桌面端。拆两个 crate 是刻意的：
#   core/  纯 Rust，不碰 tauri/webkit —— 能单独编译、单独测，将来也能被 CLI 复用
#   app/   只做 IPC 绑定与窗口，薄到几乎没有逻辑
# 好处很实在：CI 和无 GUI 环境（比如容器）里 core 照样跑测试。
[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
