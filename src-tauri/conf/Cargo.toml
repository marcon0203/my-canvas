# 配置与权限：Agent 配置、厂商端点、工具风险档。
[package]
name = "studio-conf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 供应商配置是一家一个 YAML —— 人要直接拿编辑器改，所以不是 JSON。
# serde_yaml 已经不维护了，_ng 是它的维护分支
serde_yaml_ng = "0.10"
studio-error = { path = "../error" }
studio-doc = { path = "../doc" }

[dev-dependencies]
tempfile = "3"
