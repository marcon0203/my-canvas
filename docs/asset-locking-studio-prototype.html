                ${n.shot ? `<span class="spacer"></span>${badge(n.shot)}` : ''}</div>
              ${body(n)}
              ${n.k==='story' ? `<span class="cv-port" data-port="${n.id}" title="拉出一个新镜头"></span>` : ''}
              ${n.k==='image' && A.cv.confirmDel !== n.shot.id
                ? `<button class="cv-del" data-act="delask" data-id="${n.shot.id}" title="删除这一镜">×</button>` : ''}
            </div>`).join('')}
          </div>
          <div class="cv__tools">
            <button data-act="cvzoomout" title="缩小">−</button>
            <button data-act="cvreset" title="复位">${ic('refresh')}</button>
            <button data-act="cvzoomin" title="放大">+</button>
          </div>
          <div class="cv__legend">
            <span><i style="background:var(--color-data-1)"></i>Idea</span>
            <span><i style="background:var(--color-data-2)"></i>Story</span>
            <span><i style="background:var(--color-data-3)"></i>Image</span>
            <span><i style="background:var(--color-data-4)"></i>Video</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* 新镜头插在该场最后一镜之后，保证 Storyboard 里的顺序自然 */
function addShot(sceneKey){
  const num = sceneKey.replace(/\D/g,'') || (A.shots.length+1);
  let i = 1, id;
  do { id = 's'+num+'-'+i++; } while (A.shots.some(s => s.id === id));
  const s = {id, sc:sceneKey, size:'中景', d:'新镜头，待补全', dur:2,
             refs:[], own:'', model:'Seedance 2.0', key:false, vid:'none',
             takes:0, verdict:null, ejected:false, refVer:{}};
  const last = A.shots.map(x => x.sc).lastIndexOf(sceneKey);
  if (last === -1) A.shots.push(s); else A.shots.splice(last+1, 0, s);
  return s;
}

function cvBind(){
  const root = document.getElementById('cvroot');
  const wrap = document.getElementById('cvwrap'), surf = document.getElementById('cvsurf');
  if (!root || !wrap || !surf) return;
  const g = cvGraph();
  let mode = null, sx = 0, sy = 0, node = null, ox = 0, oy = 0, el = null, hover = null, port = null, pin = null, ghost = null;

  const toCanvas = e => {
    const r = wrap.getBoundingClientRect();
    return {x:(e.clientX - r.left - A.cv.tx)/A.cv.zoom, y:(e.clientY - r.top - A.cv.ty)/A.cv.zoom};
  };
  const hit = (p, kind) => g.nodes.find(n => n.k === kind
    && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + NH(kind));
  const mark = id => {
    if (hover && hover !== id) wrap.querySelector(`[data-cv="${CSS.escape(hover)}"]`)?.removeAttribute('data-drop');
    hover = id;
    if (id) wrap.querySelector(`[data-cv="${CSS.escape(id)}"]`)?.setAttribute('data-drop','true');
  };
  const tmp = (x1,y1,x2,y2) => {
    const p = document.getElementById('cvtmp'); if (!p) return;
    if (x1 === null){ p.removeAttribute('d'); return; }
    const m = (x1+x2)/2;
    p.setAttribute('d', `M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`);
  };

  root.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-act]')) return;   // 按钮交给 click 处理
    const pinEl = e.target.closest('[data-pin]');
    const portEl = e.target.closest('[data-port]');
    const t = e.target.closest('[data-cv]');
    sx = e.clientX; sy = e.clientY;

    if (pinEl){
      mode = 'pin'; pin = pinEl.dataset.pin;
      ghost = document.createElement('div');
      ghost.className = 'cv-ghost'; ghost.textContent = pin;
      document.body.appendChild(ghost);
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    } else if (portEl){
      mode = 'link'; port = g.byId[portEl.dataset.port];
    } else if (t){
      mode = 'node'; el = t; node = g.byId[t.dataset.cv]; ox = node.x; oy = node.y; A.cv.sel = node.id;
      wrap.querySelectorAll('[data-cv]').forEach(x => x.setAttribute('aria-selected', x === t));
    } else if (e.target.closest('#cvwrap')){
      mode = 'pan'; ox = A.cv.tx; oy = A.cv.ty;
    }
    if (mode) root.setPointerCapture(e.pointerId);
  });

  root.addEventListener('pointermove', e => {
    if (!mode) return;
    const dx = (e.clientX - sx)/A.cv.zoom, dy = (e.clientY - sy)/A.cv.zoom;
    if (mode === 'node'){
      el.style.left = (ox + dx) + 'px'; el.style.top = (oy + dy) + 'px';
      if (node.k === 'image'){ const h = hit(toCanvas(e), 'story'); mark(h ? h.id : null); }
    } else if (mode === 'link'){
      const p = toCanvas(e);
      tmp(port.x + port.w, port.y + NH('story')/2, p.x, p.y);
    } else if (mode === 'pin'){
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const h = hit(toCanvas(e), 'image'); mark(h ? h.id : null);
    } else {
      surf.style.transform = `translate(${ox + e.clientX - sx}px,${oy + e.clientY - sy}px) scale(${A.cv.zoom})`;
    }
  });

  root.addEventListener('pointerup', e => {
    if (!mode) return;
    const dx = (e.clientX - sx)/A.cv.zoom, dy = (e.clientY - sy)/A.cv.zoom;
    let changed = false;

    if (mode === 'node'){
      const target = node.k === 'image' ? hit(toCanvas(e), 'story') : null;
      mark(null);
      if (target && node.shot && node.shot.sc !== target.beat.k){
        const from = node.shot.sc;
        node.shot.sc = target.beat.k;
        delete A.cv.pos[node.id]; delete A.cv.pos['vid:'+node.shot.id];
        A.shotSel = node.shot.id; changed = true;
        toast(`${node.shot.id} 已从「${from}」移到「${target.beat.k}」— Storyboard 里的归属同步变了`);
      } else if (Math.abs(dx) + Math.abs(dy) > 2){
        A.cv.pos[node.id] = {x:ox + dx, y:oy + dy}; changed = true;
      }
    } else if (mode === 'link'){
      tmp(null);
      const s = addShot(port.beat.k);
      A.shotSel = s.id; A.cv.sel = 'img:' + s.id; changed = true;
      toast(`已在「${port.beat.k}」新建 ${s.id} — Storyboard 里多了一行，去补画面和提示词`);
    } else if (mode === 'pin'){
      if (ghost){ ghost.remove(); ghost = null; }
      const h = hit(toCanvas(e), 'image');
      mark(null);
      if (h){
        if (pin === 'STYLE'){
          toast('画风基准是全片共用的，已经自动挂在每一镜上，不用逐个绑');
        } else {
          const a = byAid(pin);
          if (!a || a.status !== 'locked') toast(`${pin} 还没定稿，不能绑定 — 先去 Assets 定稿锁定`);
          else if (h.shot.refs.includes(pin)) toast(`${h.shot.id} 已经引用了 ${pin}`);
          else {
            h.shot.refs.push(pin); h.shot.refVer[pin] = a.ver;
            A.shotSel = h.shot.id; changed = true;
            toast(`${h.shot.id} 现在引用 ${pin}@v${a.ver} — 提示词合成里多一段，参考图自动绑上`);
          }
        }
      }
    } else {
      A.cv.tx = ox + e.clientX - sx; A.cv.ty = oy + e.clientY - sy;
    }

    mode = null; el = null; node = null; port = null; pin = null;
    if (changed) render();
  });

  wrap.addEventListener('dblclick', e => {
    const t = e.target.closest('[data-cv]'); if (!t) return;
    const n = g.byId[t.dataset.cv]; if (!n) return;
    if (n.k === 'idea'){ A.step = 'outline'; }
    else if (n.k === 'story'){ A.step = 'outline'; A.nodeSel = n.beat.id; }
    else { A.step = n.k === 'video' ? 'editing' : 'storyboard'; A.shotSel = n.shot.id; A.clipSel = n.shot.id; }
    A.agent = []; render();
  });
}

/* ============================================================ Metrics（增强模块） */
function viewMetrics(){
  const spent = 110 - A.credits;
  const hit = hitRate();
  const byModel = {}, bySize = {};
  A.shots.forEach(s => {
    if (!s.takes) return;
    (byModel[s.model] = byModel[s.model] || {t:0,o:0}).t += s.takes;
    if (s.verdict==='ok') byModel[s.model].o += 1;
    (bySize[s.size] = bySize[s.size] || {t:0,o:0}).t += s.takes;
    if (s.verdict==='ok') bySize[s.size].o += 1;
  });
  const bar = (o,t) => { const p = t ? Math.round(o/t*100) : 0;
    return `<div style="flex:1;min-width:90px"><div style="height:6px;border-radius:999px;background:var(--color-bg-muted);overflow:hidden">
      <div style="height:100%;width:${Math.max(p,2)}%;border-radius:999px;background:var(--color-${p>=25?'success':'warning'})"></div></div></div>
      <span class="mono" style="width:76px;text-align:right;font-size:12px;color:var(--color-text-secondary)">${o}/${t} · ${p}%</span>`; };

  const beats = A.acts.flatMap(a=>a.beats).length;
  const totalDur = A.shots.reduce((n,s)=>n+s.dur,0);
  const okDur = A.shots.filter(s=>s.verdict==='ok').reduce((n,s)=>n+s.dur,0);
  const assetN = assetList().length;
  const steps = [
    ['剧情大纲', 'Plot outline', `${A.acts.length} 幕 · ${beats} 场`, 1],
    ['剧本', 'Script', `${A.blocks.length} 个块`, 1],
    ['资产', 'Assets', `${locked()}/${assetN} 已定稿`, assetN ? locked()/assetN : 0],
    ['分镜', 'Storyboard', `${usable()}/${A.shots.length} 可用 · 命中率 ${hit}%`, A.shots.length ? usable()/A.shots.length : 0],
    ['剪辑', 'Editing', `${okDur}s / ${totalDur}s 可用素材`, totalDur ? okDur/totalDur : 0],
  ];

  const C = 2*Math.PI*52;
  const ringOff = C*(1 - Math.max(hit,1)/100);

  return `<div class="stage" data-od-id="stage-metrics">
    <div class="stage__bar"><span class="stage__title">Metrics</span><span class="pill pill--a">增强模块</span>
      <span class="pill">${ic('bolt')}已消耗 ${spent} 积分</span>
      <div class="spacer"></div>
      <button class="tbtn" data-act="diff">${ic('layers')}与基础版的差异</button></div>
    <div class="stage__body"><div class="pad" style="max-width:1080px">

      <div class="blk" style="margin-bottom:16px"><div class="blk__body" style="padding:26px 28px;display:flex;gap:36px;align-items:center">
        <div class="mhero__ring" data-od-id="metric-hitring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="52" fill="none" stroke="var(--color-bg-muted)" stroke-width="11"/>
            <circle cx="66" cy="66" r="52" fill="none" stroke="var(--color-accent)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${ringOff.toFixed(1)}" transform="rotate(-90 66 66)"/>
          </svg>
          <div class="mhero__num"><span><b>${hit}</b><i>%</i></span><em>命中率</em></div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:18px;font-weight:600;letter-spacing:-.01em">生产记账</div>
          <div class="t-cap dim" style="margin:3px 0 18px">命中率 = 可用镜头 ÷ 累计生成次数。这个数字决定第二部片能不能比第一部便宜。</div>
          <div class="mstats">
            <div class="mstat"><span class="card__m">累计生成</span><b>${tries()}</b></div>
            <div class="mstat"><span class="card__m">可用镜头</span><b>${usable()}</b></div>
            <div class="mstat"><span class="card__m">单条可用成本</span><b>${usable()?(spent/usable()).toFixed(1):'—'}<u>积分</u></b></div>
          </div>
        </div>
      </div></div>

      <div class="mcharts">
        <div class="blk" style="margin:0"><div class="blk__body" style="padding:18px 20px 20px">
          <div style="font-size:15px;font-weight:600">按模型归因</div>
          <div class="t-cap dim" style="margin:2px 0 14px">同一批镜头，不同模型的出片稳定性</div>
          ${Object.entries(byModel).map(([m,v]) => `<div class="row" style="gap:12px;padding:7px 0">
            <span style="width:110px;font-size:13px;flex:0 0 auto">${m}</span>${bar(v.o,v.t)}</div>`).join('')}
          <div class="minsight">${ic('spark')}命中率高的模型，下一部片优先排它。</div>
        </div></div>
        <div class="blk" style="margin:0"><div class="blk__body" style="padding:18px 20px 20px">
          <div style="font-size:15px;font-weight:600">按景别归因</div>
          <div class="t-cap dim" style="margin:2px 0 14px">哪种镜头最费生成次数</div>
          ${Object.entries(bySize).map(([m,v]) => `<div class="row" style="gap:12px;padding:7px 0">
            <span style="width:110px;font-size:13px;flex:0 0 auto">${m}</span>${bar(v.o,v.t)}</div>`).join('')}
          <div class="minsight">${ic('spark')}难的景别一眼看得出来。下一部片排产时把它们前置，别等到最后才发现有几个镜头怎么都出不来。</div>
        </div></div>
      </div>

      <div class="blk" style="margin:16px 0 0"><div class="blk__body" style="padding:6px 20px">
        ${steps.map(([zh,en,d,p],i) => `<div class="mstep${i<steps.length-1?' mstep--line':''}">
          <div class="row"><span class="mstep__n">${zh}<small>${en}</small></span>
            <span class="t-cap muted">${d}</span>
            <div class="spacer"></div>
            <span class="pill ${p>=1?'pill--ok':''}">${p>=1?'完成':p>0?'进行中':'未开始'}</span></div>
          <div class="mstep__track"><div class="mstep__fill" style="width:${Math.max(p*100,2)}%"></div></div>
        </div>`).join('')}
      </div></div>
    </div></div>
  </div>`;
}

/* ============================================================ 渲染 */
function render(){
  renderTop();
  if (A.route === 'home'){ $('#work').className = 'work work--full'; $('#work').innerHTML = viewHome(); return; }
  const v = {outline:viewOutline, script:viewScript, assets:viewAssets, storyboard:viewSB, editing:viewEdit, overview:viewCanvas, metrics:viewMetrics}[A.step];
  $('#work').className = 'work';
  $('#work').innerHTML = v() + renderAgent();
  const l = $('#alog'); if (l) l.scrollTop = l.scrollHeight;
  if (A.step === 'overview') cvBind();
  paintShotPreviews();
}

/* ============================================================ 交互 */
document.addEventListener('click', e => {
  const t = s => e.target.closest(s);
  let el;
  if (el = t('[data-act]')) return act(el.dataset.act, el);
  if (el = t('[data-go]'))   { A.route = el.dataset.go; return render(); }
  if (el = t('[data-mode]')) { if (el.dataset.mode === 'Start a story'){ A.route='project'; A.step='outline'; return render(); } return toast(el.dataset.mode + ' 模式'); }
  if (el = t('[data-open]')) { A.route='project'; A.step='script'; return render(); }
  if (el = t('[data-step]')) { A.step = el.dataset.step; A.agent = []; return render(); }
  if (el = t('[data-node]')) { A.nodeSel = el.dataset.node; return render(); }
  if (el = t('[data-doctab]')) { A.docTab = el.dataset.doctab; A.blockEdit = null; render();
                               const b = document.querySelector('.stage__body'); if (b) b.scrollTop = 0; return; }
  if (el = t('[data-view]')) { A.assetSel = el.dataset.asset; A.viewSel[A.assetSel] = el.dataset.view; return render(); }
  if (el = t('[data-goto-shot]')) { A.shotSel = el.dataset.gotoShot; A.step = 'storyboard'; A.agent = []; return render(); }
  if (el = t('[data-asset]')){ A.assetSel = el.dataset.asset; return render(); }
  if (el = t('[data-run]')) { const s = A.shots.find(x => x.id===el.dataset.run); if (!s) return render();
                               if (s._run) { toast('「'+s.id+'」正在生成中…'); return render(); }
                               A.shotSel = s.id; s._run = true; s.takes = (s.takes||0)+2;
                               spend(3,'运行生成'); toast('「'+s.id+'」生成任务已提交 · '+s.model);
                               setTimeout(() => { s._run = false; s.key = true; render(); }, 1200);
                               return render(); }
  if (el = t('[data-modal]')){ A.modal = el.dataset.modal;
    $('#layer').innerHTML = {stage:modalStage, rig:modalStage, light:modalStage, gear:modalGear}[A.modal]();
    return A.modal === 'gear' ? undefined : bindStage(); }
  if ((e.target.classList && e.target.classList.contains('mo')) || t('button[data-close]')) return closeModal();

  if (el = t('[data-pose]')){ const c = rigTarget(); if(!c) return;
    c.pose = el.dataset.pose; c.custom = null;
    setFigurePose(c.pose);
    try { paintShotPreviews(c); } catch(e){}
    document.querySelectorAll('[data-pose]').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.pose === c.pose));
    return; }
  if (el = t('[data-wmskin]')){ setWhiteModelSkin(el.dataset.wmskin);
    document.querySelectorAll('[data-wmskin]').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.wmskin === WM_SKIN));
    try { paintShotPreviews(); } catch(e){}
    if (WM_SKIN === 'blue' && (rigTarget()||{}).poseMode !== 'text')
      toast('蓝模在界面上最好认，但当参考图传给模型时，中性灰更不容易给画面带色');
    return; }
  if (el = t('[data-posemode]')){ const c = rigTarget(); if(!c) return;
    c.poseMode = el.dataset.posemode; c.custom = null;
    $('#layer').innerHTML = modalRig(); return bind3D(); }
  if (el = t('[data-rigset]')){ const [az,el2,d,sp] = el.dataset.rigset.split(',');
    const c = rigTarget(); if (!c) return;
    c.az = Number(az); c.el = Number(el2); c.dist = Number(d);
    c.angle = sp || '';                       // 过肩这类特殊机位要一起带上，光靠角度表达不了
    c.size = distName(c.dist); c.custom = null;
    paintStage(c);
    return; }
  if (el = t('[data-cview]')){ const [w,vx,vy] = el.dataset.cview.split('|');
    V[w].vx = Number(vx); V[w].vy = Number(vy);
    const root = document.getElementById(w+'3d');
    if (root){ root.style.setProperty('--vx', vx+'deg'); root.style.setProperty('--vy', vy+'deg');
      root.querySelectorAll('[data-cview]').forEach(b => b.setAttribute('aria-pressed', b === el));
      const c = rigTarget(); if (c) paintStage(c); }
    return; }
  if (el = t('[data-gearpick]')){ const [k,i] = el.dataset.gearpick.split('|');
    const c = rigTarget(); if (!c) return; c[k] = GEAR[k].o[+i][0];
    $('#layer').innerHTML = modalGear(); return bind3D(); }
  if (el = t('[data-ratio]')){ const c = rigTarget(); if(!c) return;
    c.ratio = el.dataset.ratio; c.custom = null;
    $('#layer').innerHTML = modalStage(); return bindStage(); }
  if (el = t('[data-stagesel]')){ A.stageSel = el.dataset.stagesel;
    document.querySelectorAll('[data-stagesel]').forEach(b => b.setAttribute('aria-pressed', b === el));
    document.querySelectorAll('[data-grp]').forEach(g => g.setAttribute('data-on', String(g.dataset.grp === A.stageSel)));
    return; }
  if (el = t('[data-sview]')){ const [vx,vy] = el.dataset.sview.split('|').map(Number);
    const st = (window.THREE && ST3) ? ST3 : null;
    if (st){ st.vx = vx; st.vy = vy; paintStage(rigTarget()); }
    document.querySelectorAll('[data-sview]').forEach(b => b.setAttribute('aria-pressed', b === el));
    return; }
  if (el = t('[data-gel]')){ const c = rigTarget(); if(!c) return;
    c.gel = el.dataset.gel; c.custom = null;
    document.querySelectorAll('[data-gel]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gel === c.gel));
    document.querySelectorAll('.gel--pick').forEach(b => b.setAttribute('aria-pressed','false'));
    paintStage(c);
    return; }
  if (el = t('[data-lview]')){ const [vx,vy] = el.dataset.lview.split('|').map(Number);
    document.querySelectorAll('[data-lview]').forEach(b => b.setAttribute('aria-pressed', b === el));
    return; }
  if (el = t('[data-lset]')){ const [az,el2] = el.dataset.lset.split(',').map(Number);
    const c = rigTarget(); if (!c) return; c.lightAz = az; c.lightEl = el2;
    paintStage(c);
    document.querySelectorAll('[data-lset]').forEach(b => b.setAttribute('aria-pressed', b === el));
    return; }
  if (el = t('[data-rigtoggle]')){ const c = rigTarget(); if (!c) return; const k = el.dataset.rigtoggle;
    c[k] = !c[k]; el.setAttribute('aria-pressed', !!c[k]); return; }
  if (el = t('[data-gear]')){ const [k, dir] = el.dataset.gear.split('|');
    const c = rigTarget(); if (!c) return; const G = GEAR[k];
    const i = Math.max(0, G.o.findIndex(x => x[0] === c[k]));
    c[k] = G.o[(i + Number(dir) + G.o.length) % G.o.length][0];
    $('#layer').innerHTML = modalGear(); return bind3D(); }
  if (el = t('[data-intent]')){ const p = INTENT.concat(A.presets)[+el.dataset.intent];
    const c = rigTarget(); if(!c||!p) return;
    Object.entries(p.c).forEach(([k,v]) => { c[k] = Array.isArray(v) ? [...v] : v;
      if (CINE[k] && !c.dims.includes(k)) c.dims.push(k); });
    if (p.c.size && p.c.dist === undefined) c.dist = Math.max(0, SIZE_ORD.indexOf(p.c.size));
    if (p.c.angle && p.c.el === undefined){
      c.el = p.c.angle==='俯拍'?38:p.c.angle==='仰拍'?-26:0;
      c.angle = ['荷兰角','过肩','主观','顶拍'].includes(p.c.angle) ? p.c.angle : '';
      if (p.c.angle === '过肩' && p.c.az === undefined) c.az = 150; }
    if (p.c.lens && p.c.mm === undefined) c.mm = {'广角':'24mm','标准':'50mm','中长焦':'85mm','长焦':'135mm','微距':'85mm'}[p.c.lens] || c.mm;
    if (p.c.dof && p.c.fstop === undefined) c.fstop = {'浅景深':'f/1.4','中等':'f/4','深景深':'f/8'}[p.c.dof] || c.fstop;
    c.size = distName(c.dist);
    toast(`已按「${p.n}」配好整套 — 机位、灯光、器材都能再单独调`); return render(); }
  if (el = t('[data-dimadd]')){ const k = el.dataset.dimadd; const c = rigTarget(); if(!c) return;
    if (!c.dims.includes(k)) c.dims.push(k);
    if (!CINE[k].one && !Array.isArray(c[k])) c[k] = [];
    return render(); }
  if (el = t('[data-dimdel]')){ const k = el.dataset.dimdel; const c = rigTarget(); if(!c) return;
    c.dims = c.dims.filter(x => x !== k); c[k] = CINE[k].one ? '' : [];
    return render(); }
  if (el = t('[data-cine]')){ const [k, v] = el.dataset.cine.split('|');
    const c = rigTarget(); if(!c) return;
    if (CINE[k].one){ c[k] = c[k] === v ? '' : v; }
    else { if (!Array.isArray(c[k])) c[k] = [];
      const i = c[k].indexOf(v); i>=0 ? c[k].splice(i,1) : c[k].push(v);
      if (!c.dims.includes(k)) c.dims.push(k); }
    return render(); }
  if (el = t('[data-shot]')) { A.shotSel = el.dataset.shot; return render(); }
  if (el = t('[data-clip]')) { A.clipSel = el.dataset.clip; return render(); }
  if (el = t('[data-sty]'))  { const x = findAsset(A.assetSel); if (!x) return render();
                               const v = curView(x); v[1] = el.dataset.sty;
                               toast('「'+x.n+' · '+v[0]+'」的风格已切换为「'+v[1]+'」'); return render(); }
  if (el = t('[data-nvsty]')){ A._nvSty = el.dataset.nvsty;
                               document.querySelectorAll('[data-nvsty]').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (el = t('[data-sbsty]')){ const s = A.shots.find(x => x.id===A.shotSel); if (!s) return render();
                               const v = el.dataset.sbsty; v==='全局' ? delete s.style : s.style = v; delete s.custom;
                               toast('「'+s.id+'」画风改为「'+v+'」'); return render(); }
  if (el = t('[data-sbref]')){ const s = A.shots.find(x => x.id===A.shotSel); if (!s) return render();
                               const aid = el.dataset.sbref, i = s.refs.indexOf(aid);
                               if (i >= 0) { s.refs.splice(i,1); delete s.refVer[aid]; if (s.refImg===aid) delete s.refImg; }
                               else { s.refs.push(aid); const a2 = byAid(aid); s.refVer[aid] = a2 ? a2.ver||1 : 1; }
                               delete s.custom;
                               toast('「'+s.id+'」'+(i>=0?'取消引用 ':'引用 ')+aid); return render(); }
  if (el = t('[data-sbrefimg]')){ const s = A.shots.find(x => x.id===A.shotSel); if (!s) return render();
                               const v = el.dataset.sbrefimg; v ? s.refImg = v : delete s.refImg; delete s.custom;
                               toast('「'+s.id+'」参考图：'+(v ? v : '自动')); return render(); }
  if (el = t('[data-skill]')){ A.agent.push({who:'me',t:el.dataset.skill},{who:'ai',t:'已启用 Skill「'+el.dataset.skill+'」。告诉我要处理哪一部分，或者直接给我一句灵感。'}); return render(); }
  if (!t('.blk__body') && A.blockEdit){ A.blockEdit = null; return render(); }
});

document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-blk]');
  if (el){ A.blockEdit = el.dataset.blk; render(); const ta = $('.blk__edit'); if (ta) ta.focus(); }
});

document.addEventListener('change', e => {
  const f = e.target.closest('#wmfile');
  if (f && f.files && f.files[0]) useLocalGLB(f.files[0]);
});
document.addEventListener('input', e => {
  const gx = e.target.closest('[data-gelhex]');
  if (gx){ const c = rigTarget(); if (c){ c.gelHex = gx.value; c.gel = 'custom'; c.custom = null;
    const lab = gx.closest('.gel'); if (lab){ lab.style.setProperty('--gc', gx.value); lab.setAttribute('aria-pressed','true'); }
    document.querySelectorAll('[data-gel]').forEach(b => b.setAttribute('aria-pressed','false'));
    paintStage(c); } return; }
  const rx = e.target.closest('[data-rimhex]');
  if (rx){ const c = rigTarget(); if (c){ c.rimHex = rx.value; c.custom = null;
    const lab = rx.closest('.gel'); if (lab) lab.style.setProperty('--gc', rx.value);
    paintStage(c); } return; }
  const rg = e.target.closest('[data-rig]');
  if (rg){ const k = rg.dataset.rig, c = rigTarget();
    if (c){ c[k] = Number(rg.value);
      paintStage(c); }
    return; }
  if (e.target.id === 'sb-own'){ const s = A.shots.find(x => x.id===A.shotSel); if (!s) return;
    s.own = e.target.value; s.custom = null; return; }
  const el = e.target.closest('[data-blkedit]');
  if (el){ const b = A.blocks.find(x => x.id === el.dataset.blkedit); if (b) b.body = el.value; }
  if (e.target.id === 'sb-prompt'){ const s = A.shots.find(x => x.id===A.shotSel); if (!s) return;
    s.custom = e.target.value; s.ejected = true; }
});

/* 分镜运行台的参数下拉：模型 / 尺寸 */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-sbmodel],[data-sbratio],[data-sbbatch],[data-sbdur]'); if (!el) return;
  const s = A.shots.find(x => x.id===A.shotSel); if (!s) return;
  if (el.hasAttribute('data-sbmodel')){ s.model = el.value; toast('「'+s.id+'」模型改为「'+s.model+'」'); }
  else if (el.hasAttribute('data-sbratio')){ s.ratio = el.value; delete s.custom; toast('「'+s.id+'」尺寸改为「'+s.ratio+'」'); }
  else if (el.hasAttribute('data-sbbatch')){ s.batch = parseInt(el.value, 10); toast('「'+s.id+'」一次生成 ×'+s.batch); }
  else { s.dur = parseInt(el.value, 10); toast('「'+s.id+'」时长改为 '+s.dur+'s'); }
  return render();
});

/* 剧情结构树的幕折叠状态持久化（toggle 不冒泡，用捕获阶段接） */
document.addEventListener('toggle', e => {
  const d = e.target.closest ? e.target.closest('[data-actgrp]') : null;
  if (d) (A.expl = A.expl || {})[d.dataset.actgrp] = d.open;
  if (e.target.classList && e.target.classList.contains('learn')) A.learnOpen = e.target.open;
  if (e.target.classList && e.target.classList.contains('aux__more')) A.auxOpen = e.target.open;
}, true);

/* 键盘可达：div 做的选择器用 Enter / Space 触发与点击相同的行为 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-mode],[data-open],[data-node],[data-asset],[data-shot],[data-run],[data-clip],[data-goto-shot]');
  if (!el || el.tagName === 'BUTTON') return;
  e.preventDefault();
  el.click();
});

function act(a, el){
  if (a === 'newproj') return toast('新建项目：从一句灵感开始，或导入已有剧本');
  if (a === 'topup')   return toast('充值页面：积分用于图像与视频生成');
  if (a === 'share')   return toast('分享链接已复制 — 打开的人看到的是只读视图');
  if (a === 'moresty') return toast('风格库共 56 种，这里只摆最常用的 8 种，其余在风格面板里翻');
  if (a === 'cvzoomin')  { A.cv.zoom = Math.min(1.6, A.cv.zoom + 0.15); return render(); }
  if (a === 'cvzoomout') { A.cv.zoom = Math.max(0.5, A.cv.zoom - 0.15); return render(); }
  if (a === 'cvreset')   { A.cv.zoom = 1; A.cv.tx = 20; A.cv.ty = 10; return render(); }
  if (a === 'cvfit')     { A.cv.zoom = 0.85; A.cv.tx = 20; A.cv.ty = 10; A.cv.pos = {}; return render(); }
  if (a === 'delask')  { A.cv.confirmDel = el.dataset.id; return render(); }
  if (a === 'delno')   { A.cv.confirmDel = null; return render(); }
  if (a === 'delyes')  { const id = el.dataset.id, s = A.shots.find(x => x.id === id);
                         A.shots = A.shots.filter(x => x.id !== id);
                         delete A.cv.pos['img:'+id]; delete A.cv.pos['vid:'+id];
                         A.cv.confirmDel = null;
                         if (A.shotSel === id) A.shotSel = A.shots[0]?.id;
                         if (A.clipSel === id) A.clipSel = A.shots[0]?.id;
                         toast(s && s.takes ? `已删除 ${id} — 连同 ${s.takes} 次生成记录一起从记账里移除` : `已删除 ${id}`);
                         return render(); }
  if (a === 'anew')    { A.agent = []; return render(); }
  if (a === 'asend')   { const v = $('#ain').value.trim(); if(!v) return toast('先说点什么');
                         A.agent.push({who:'me',t:v},{who:'ai',t:'收到。我会结合当前的 '+A.step+' 环节来处理，产出会直接写进左侧文档，你可以再改。'}); return render(); }
  if (a === 'expand')  { const b = A.acts.flatMap(x=>x.beats).find(x=>x.id===A.nodeSel);
                         A.alts[b.id] = ['艾米没有去医院，第二天年糕自己回来了，但眼睛变了颜色',
                                         '医生记得年糕，消失的是艾米自己的记忆',
                                         '照片里的白猫换成了另一只黑猫，全家人都说本来就是它'];
                         spend(2,'延展剧情走向'); return render(); }
  if (a === 'toscript'){ A.step='script'; A.agent=[]; return render(); }
  if (a === 'analyze') { A.step='assets'; A.agent=[{who:'ai',t:'已从剧本解析出 2 个角色、4 个场景、3 个道具。建议把每个形状照都生成出来、定稿后再进分镜。'}];
                         spend(3,'一键分析资产'); return render(); }
  if (a === 'reextract') { spend(3,'重新提取资产'); return; }
  if (a === 'batchref'){ assetList().forEach(x => { x.ok = true; x.views.forEach(v => v[2] = 1); }); spend(18,'批量生成参考图'); return render(); }
  if (a === 'regen')   { const x = findAsset(A.assetSel); const v = curView(x); v[3] = (v[3]||0)+1; v[2] = 1; x.ok = true;
                         const r = viewRig(v);
                         spend(2,'生成形状照'); toast(x.n+' · '+v[0]+' 已按「'+v[1]+' · '+distName(r.dist)+' · '+azName(r.az)+' '+elName(r.el)+'」重新生成'); return render(); }
  if (a === 'addview-form') return openAddView();
  if (a === 'run-sb')     { const s = A.shots.find(x => x.id===A.shotSel); if (!s) return render();
                            if (s._run) { toast('「'+s.id+'」正在生成中…'); return render(); }
                            s._run = true; s.takes = (s.takes||0)+2; spend(3,'运行生成');
                            toast('「'+s.id+'」生成任务已提交 · '+s.model+' · '+(s.ratio||A.ratio));
                            setTimeout(() => { s._run = false; s.key = true; render(); }, 1200);
                            return render(); }
  if (a === 'addview') { const x = findAsset(A.assetSel); if (!x) return;
                         const n = ($('#nv-name').value||'').trim(), p = ($('#nv-prompt').value||'').trim();
                         if (!n || !p) return toast('名称和提示词都要填，才能生成');
                         if (x.views.some(v => v[0]===n)) return toast('已经有同名形状照了，换个名称');
                         const sty = A._nvSty || A.styles[0];
                         x.views.push([n, sty, 1, 0, p]);
                         A.viewSel[x.id] = n; x.ok = true;
                         $('#layer').innerHTML = '';
                         spend(2,'生成形状照'); toast('已添加「'+n+'」并按「'+sty+'」生成'); return render(); }
  if (a === 'lock')    { const x = findAsset(A.assetSel); x.status='locked'; x.ver = x.ver || 1; x.ok = true;
                         A.shots.forEach(s => { if (s.refs.includes(x.aid)) s.refVer[x.aid] = x.ver; });
                         toast(x.n+' 已定稿锁定为 '+x.aid+'@v'+x.ver+'，镜头现在可以绑定引用了'); return render(); }
  if (a === 'unlock')  { const x = findAsset(A.assetSel); x.ver += 1; x.status='draft';
                         const n = A.shots.filter(s => s.refs.includes(x.aid)).length;
                         toast('已升版为 v'+x.ver+'。'+n+' 个镜头引用旧版，已标记待确认 — 不会自动重跑'); return render(); }
  if (a === 'mark-ok') { const s = A.shots.find(x => x.id===A.shotSel); s.verdict='ok'; s.vid='ok'; s.key=true;
                         if (!s.takes) s.takes = 4; return render(); }
  if (a === 'mark-redo'){ const s = A.shots.find(x => x.id===A.shotSel); s.verdict='redo'; s.takes += 4;
                          spend(4,'重摇 ×4'); return render(); }
  if (a === 'eject')   { const s = A.shots.find(x => x.id===A.shotSel); s.ejected = !s.ejected;
                         toast(s.ejected ? '此镜已脱管：资产升版时不再自动同步，会单独列出来让你确认' : '已恢复自动合成'); return render(); }
  if (a === 'mode-easy'){ A.proMode = false; A.dimPick = false; return render(); }
  if (a === 'mode-pro') { A.proMode = true;  A.dimPick = false; return render(); }

  if (a === 'poseshot'){ const c = rigTarget(); if(!c) return;
    const url = exportPoseRef(c);
    if (!url) return toast('渲染失败 —— 浏览器没拿到 WebGL，换个环境再试');
    c.poseRef = url; c.poseAt = {az:Math.round(c.az), el:Math.round(c.el), dist:c.dist, pose:c.pose, mm:c.mm};
    toast(`已渲染 720×1280 姿态参考图 · ${distName(c.dist)} · ${azName(c.az)} · ${poseOf(c.pose||'stand').n} —— 不花钱，随时重来`);
    $('#layer').innerHTML = modalRig(); return bind3D(); }
  if (a === 'promode'){ A.proMode = !A.proMode; A.dimPick = false; return render(); }
  if (a === 'dimpick'){ A.dimPick = !A.dimPick; return render(); }
  if (a === 'savepreset'){ const c = rigTarget(); if(!c) return;
    A.presets.push({n:'我的机位 '+(A.presets.length+1),
      d:[distName(c.dist), azName(c.az), c.mm].join(' · '),
      c:{dist:c.dist, az:c.az, el:c.el, mm:c.mm, fstop:c.fstop, lensKit:c.lensKit, body:c.body,
         lightAz:c.lightAz, lightEl:c.lightEl, bright:c.bright, kelvin:c.kelvin, rim:c.rim, cam:c.cam}});
    toast('已存成一张机位卡 — 团队里谁都能直接套'); return render(); }
  if (a === 'applyall'){ const x = findAsset(A.assetSel); if (!x) return render();
    const v0 = curView(x), r = viewRig(v0);
    const peers = x.views.filter(v2 => v2 !== v0);
    peers.forEach(v2 => { const r2 = viewRig(v2);
      ['az','el','lightAz','lightEl','bright','kelvin','rim','body','lensKit','mm','fstop','cam'].forEach(k => r2[k] = r[k]); });
    toast(`已把机位朝向、灯光和器材套到本资产另外 ${peers.length} 张形状照 — 景别各留各的`);
    return render(); }
  if (a === 'genkey')  { const s = A.shots.find(x => x.id===A.shotSel); if (!s) return render();
                         s.key = true; s.takes += 2; spend(2,'生成关键帧'); return render(); }
  if (a === 'diff')    return showDiff();
  if (a === 'genkeys') { A.shots.forEach(s => s.key = true); spend(10,'生成关键帧'); return render(); }
  if (a === 'batchvid'){ A.shots.forEach(s => { if (s.vid==='none'){ s.vid='run'; s.takes += 4; } });
                         spend(24,'批量生成视频'); render();
                         setTimeout(() => { A.shots.forEach(s => { if (s.vid==='run'){ s.vid='ok'; s.key=true; } }); render(); toast('批量生成完成 — 还需要逐镜判定可用/重摇，命中率才算得出来'); }, 1400); return; }
  if (a === 'regen')   { spend(3,'重跑此镜'); return; }
  if (a === 'autocut') { toast('已按配乐节拍自动排好片段顺序'); return; }
  if (a === 'export')  { spend(12,'导出 MP4'); return; }
}


/* 新增形状照弹窗：名称 + 提示词 + 风格，确认后生成入库 */

      <div class="row" style="margin-bottom:16px"><span style="font-size:16px;font-weight:600">新增形状照 · ${esc(x.n)}</span>
        <div class="spacer"></div><button class="tbtn" data-close>关闭</button></div>
      <div class="sec" style="margin-bottom:6px">名称</div>

        <button class="tbtn" data-close>取消</button>

      </div>

  $('#layer').onclick = ev => { if (ev.target.hasAttribute('data-close')) $('#layer').innerHTML=''; };

    ['定稿锁定才能被引用', '未定稿的资产不能绑定到镜头。这是防漏网的闸口 — 只要有实体没资产，模型就会自己现编，每镜编得都不一样。'],
    ['定稿前先试拍', '用这版资产跑最难的镜头，扛得住再锁。资产图是正面棚拍，真实镜头是夜戏远景，好看不等于立得住。'],
    ['提示词三段式合成', '画风 + 资产引用 + 本镜描述。资产段自动展开并绑参考图，不用在每条提示词里手贴角色描述。'],
    ['升版不自动重跑', '资产升到 v2，引用旧版的镜头标记为待确认，由人决定哪些值得重摇。重跑不是重建，是重新抽卡。'],
    ['手改提示词会被标记脱管', '允许改，但改完这镜脱离合成体系。升版时单独列出来 — 比"以为同步了其实没同步"安全。'],
    ['每次生成都记账', '摇了几次、哪次可用，全部落账。命中率 = 可用镜头 ÷ 累计生成次数。'],
    ['按模型与景别归因', '哪个模型更容易过、哪类景别最难拍，用数据回答。下一部片据此排产和报价。'],
  ];

      <p class="t-cap dim" style="margin:0 0 22px;line-height:1.8">基础流程一致：同样五步、同样 Agent 侧栏、同样积分。差别全在一致性与记账这两件事上。</p>

        <span class="pill pill--a" style="flex:0 0 auto">${i+1}</span>
        <div><div style="font-size:14px;font-weight:600;margin-bottom:4px">${t}</div>
        <div class="t-cap muted" style="line-height:1.8">${d}</div></div></div>`).join('')}
    </div></div>`;
  $('#layer').onclick = ev => { if (ev.target.hasAttribute('data-close')) $('#layer').innerHTML=''; };

/* 空间量的默认值；旧的离散标签反推成角度 */
A.shots.forEach(s => {
  s.batch = s.batch || 1;
  s.light = s.light || []; s.comp = s.comp || []; s.time = s.time || []; s.mood = s.mood || [];
