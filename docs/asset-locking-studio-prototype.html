<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dream of Cats · 视频创作工作台</title>
<style>
/* ==========================================================================
   Apple HIG Light — Design Tokens
   依据 Apple Human Interface Guidelines 的浅色设计语言重构：
     · 系统字体栈（SF Pro / 苹方），大标题负字距
     · 纯白内容区 + #F5F5F7 侧栏，分区靠 0.08 发丝线而非阴影
     · 单一强调色 systemBlue #007AFF，无渐变、无彩色阴影
     · 主按钮为胶囊形（capsule），选中态蓝底白字（macOS 源列表式）
   ========================================================================== */

:root {
  /* ========================================================================
     1. 调色板 PALETTE
     ======================================================================== */

  /* -- systemBlue 强调色阶 ------------------------------------------------ */
  --blue-50:  rgba(0, 122, 255, .10);
  --blue-100: rgba(0, 122, 255, .14);
  --blue-500: #007AFF;   /* systemBlue */
  --blue-600: #0062D9;
  --blue-700: #004FB8;

  /* -- Apple 中性阶（暖黑文字 + 冷灰分隔） --------------------------------- */
  --neutral-0:   #FFFFFF;
  --neutral-25:  #F7F7F9;                     /* 顶栏、浮层底 */
  --neutral-50:  #F5F5F7;                     /* 侧边栏、画布次级底、行 hover */
  --neutral-100: #E9E9EB;                     /* 药丸底、轨道、键帽 */
  --neutral-150: rgba(0, 0, 0, .08);          /* 发丝线：卡片、分割线 */
  --neutral-200: rgba(0, 0, 0, .12);          /* 输入框、次要按钮描边 */
  --neutral-300: rgba(0, 0, 0, .22);          /* hover 态描边 */
  --neutral-400: #AEAEB2;
  --neutral-500: #6E6E73;                     /* Apple secondary label */
  --neutral-600: #48484A;
  --neutral-700: #3A3A3C;
  --neutral-900: #1D1D1F;                     /* Apple primary label */

  /* -- Apple 系统色（数据编码与状态） --------------------------------------- */
  --coral-50:  rgba(255, 149, 0, .14);
  --coral-100: rgba(255, 149, 0, .22);
  --coral-400: #FFB340;
  --coral-500: #FF9500;   /* systemOrange */
  --coral-600: #C77400;

  --amber-50:  rgba(255, 204, 0, .16);
  --amber-100: rgba(255, 204, 0, .26);
  --amber-400: #FFD426;
  --amber-500: #FFCC00;
  --amber-600: #B8860B;

  --cyan-50:  rgba(90, 200, 250, .16);
  --cyan-400: #7DD8FC;
  --cyan-500: #5AC8FA;    /* systemTeal(light) */
  --cyan-600: #2596C4;

  /* -- 状态色 -------------------------------------------------------------- */
  --green-50:  rgba(52, 199, 89, .14);
  --green-500: #34C759;   /* systemGreen */
  --green-600: #248A3D;

  --red-50:  rgba(255, 59, 48, .12);
  --red-500: #FF3B30;     /* systemRed */
  --red-600: #D92D20;     /* 小字号文字用深一档保证对比度 */

  /* ========================================================================
     2. 语义层 SEMANTIC —— 组件只引用下面这些
     ======================================================================== */

  /* -- 表面与背景 ---------------------------------------------------------- */
  --color-bg-canvas:   var(--neutral-0);       /* 内容区画布：纯白 */
  --color-bg-sidebar:  var(--neutral-50);      /* 树 / Agent 侧栏 */
  --color-bg-surface:  var(--neutral-0);       /* 卡片 */
  --color-bg-muted:    var(--neutral-100);     /* 药丸、分段轨道、表头 */
  --color-bg-hover:    rgba(0, 0, 0, .045);    /* 行 hover */
  --color-bg-overlay:  rgba(0, 0, 0, .40);

  /* -- 描边 ---------------------------------------------------------------- */
  --color-border-subtle:  var(--neutral-150);
  --color-border-default: var(--neutral-200);
  --color-border-strong:  var(--neutral-300);
  --color-border-focus:   var(--blue-500);

  /* -- 文字 ---------------------------------------------------------------- */
  --color-text-primary:   var(--neutral-900);
  --color-text-secondary: var(--neutral-500);
  --color-text-tertiary:  var(--neutral-400);
  --color-text-disabled:  rgba(0, 0, 0, .20);
  --color-text-inverse:   var(--neutral-0);

  /* -- 强调 ---------------------------------------------------------------- */
  --color-accent:         var(--blue-500);
  --color-accent-hover:   var(--blue-600);
  --color-accent-active:  var(--blue-700);
  --color-accent-soft:    var(--blue-100);    /* 图标 chip 底、激活药丸 */
  --color-accent-subtle:  var(--blue-50);     /* 选中底、hover 底 */
  --color-on-accent:      var(--neutral-0);

  /* Apple 不做品牌渐变；保留变量名以兼容既有按钮，渲染为纯色 */
  --gradient-accent: var(--blue-500);

  /* -- 语义状态 ------------------------------------------------------------ */
  --color-success:      var(--green-500);
  --color-success-bg:   var(--green-50);
  --color-error:        var(--red-600);
  --color-error-bg:     var(--red-50);
  --color-warning:      var(--coral-600);
  --color-warning-bg:   var(--coral-50);
  --color-info:         var(--blue-500);
  --color-info-bg:      var(--blue-50);

  /* -- 数据可视化（Apple chart 配色） ---------------------------------------- */
  --color-data-1:      var(--blue-500);
  --color-data-1-soft: rgba(0, 122, 255, .12);
  --color-data-2:      var(--coral-500);
  --color-data-2-soft: rgba(255, 149, 0, .14);
  --color-data-3:      var(--green-500);
  --color-data-3-soft: rgba(52, 199, 89, .14);
  --color-data-4:      #AF52DE;
  --color-data-4-soft: rgba(175, 82, 222, .13);

  --color-chart-grid:  rgba(0, 0, 0, .06);
  --color-chart-axis:  var(--neutral-400);
  --color-chart-track: var(--neutral-100);
  --gradient-chart-area: linear-gradient(180deg, rgba(0, 122, 255, .16) 0%, rgba(0, 122, 255, 0) 100%);

  /* ========================================================================
     3. 圆角 RADIUS —— Apple 控件偏小圆角，卡片 10–12
     ======================================================================== */
  --radius-shell:   0;
  --radius-card:    12px;
  --radius-tile:    10px;
  --radius-control: 10px;
  --radius-chip:    7px;
  --radius-xs:      5px;
  --radius-full:    999px;

  /* ========================================================================
     4. 阴影 SHADOW —— Apple 几乎只靠发色分层，阴影极克制
     ======================================================================== */
  --shadow-card:   0 1px 2px rgba(0, 0, 0, .04);
  --shadow-raised: 0 10px 30px rgba(0, 0, 0, .12);
  --shadow-shell:  none;
  --shadow-accent: none;
  --shadow-focus:  0 0 0 3px rgba(0, 122, 255, .32);

  /* ========================================================================
     5. 字体 TYPOGRAPHY —— 系统栈：SF Pro / 苹方，数字用 tabular
     ======================================================================== */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-numeric: var(--font-sans);

  --text-axis:       11px;  --leading-axis:       16px;
  --text-caption:    12px;  --leading-caption:    16px;
  --text-label:      13px;  --leading-label:      18px;
  --text-body:       14px;  --leading-body:       20px;
  --text-title:      16px;  --leading-title:      24px;
  --text-metric-sm:  20px;  --leading-metric-sm:  28px;
  --text-metric:     24px;  --leading-metric:     32px;

  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;

  --tracking-tight:   -0.02em;
  --tracking-normal:  0;
  --tracking-wide:    0.04em;

  /* ========================================================================
     6. 间距 / 尺寸 / 动效 / 层级
     ======================================================================== */
  --space-1:   4px;  --space-2:  8px;   --space-3:  12px;
  --space-4:  16px;  --space-5: 20px;   --space-6:  24px;
  --space-8:  32px;  --space-10: 40px;  --space-12: 48px;

  --sidebar-width: 264px;
  --header-h:      52px;
  --rail-width:    320px;
  --gutter:        var(--space-6);
  --card-padding:  var(--space-6);
  --tile-padding:  var(--space-4);

  --icon-sm: 16px;  --icon-md: 20px;  --icon-lg: 24px;
  --chip-size: 32px;  --chip-lg: 36px;

  --duration-fast: 120ms;
  --duration-base: 180ms;
  --ease-standard: cubic-bezier(.2, 0, .2, 1);

  --z-sticky: 10;  --z-dropdown: 100;  --z-modal: 200;  --z-toast: 300;
}

/* ==========================================================================
   深色模式（Apple dark：纯黑底 + #1C1C1E 表面 + #0A84FF）
   ========================================================================== */
[data-theme="dark"] {
  --color-bg-canvas:   #000000;
  --color-bg-sidebar:  #1C1C1E;
  --color-bg-surface:  #1C1C1E;
  --color-bg-muted:    #2C2C2E;
  --color-bg-hover:    rgba(255, 255, 255, .06);

  --color-border-subtle:  rgba(255, 255, 255, .10);
  --color-border-default: rgba(255, 255, 255, .16);
  --color-border-strong:  rgba(255, 255, 255, .28);

  --color-text-primary:   #F5F5F7;
  --color-text-secondary: #98989D;
  --color-text-tertiary:  #636366;
  --color-text-disabled:  rgba(255, 255, 255, .24);

  --color-accent:        #0A84FF;
  --color-accent-hover:  #409CFF;
  --color-accent-soft:   rgba(10, 132, 255, .18);
  --color-accent-subtle: rgba(10, 132, 255, .12);

  --color-success-bg: rgba(48, 209, 88, .18);
  --color-error-bg:   rgba(255, 69, 58, .18);
  --color-warning-bg: rgba(255, 159, 10, .18);
  --color-info-bg:    rgba(10, 132, 255, .16);

  --color-chart-grid:  rgba(255, 255, 255, .08);
  --color-chart-track: #2C2C2E;

  --shadow-card:   none;
  --shadow-raised: 0 12px 36px rgba(0, 0, 0, .5);
}

/* ==========================================================================
   基础
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--color-bg-canvas); overflow: hidden; }

.ds-root {
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  color: var(--color-text-primary);
  background: var(--color-bg-canvas);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.ds-root ::selection { background: rgba(0, 122, 255, .18); }

/* 键盘焦点：统一 systemBlue 光环 */
.ds-root :focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
  border-radius: var(--radius-xs);
}

/* 滚动条：细、灰、圆头 */
.stage__body::-webkit-scrollbar, .expl__tree::-webkit-scrollbar,
.agent__log::-webkit-scrollbar, .pad::-webkit-scrollbar { width: 8px; }
.stage__body::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 999px; }
.stage__body::-webkit-scrollbar-track { background: transparent; }
.expl__tree::-webkit-scrollbar-thumb, .agent__log::-webkit-scrollbar-thumb,
.pad::-webkit-scrollbar-thumb { background: rgba(0,0,0,.16); border-radius: 999px; }
.expl__tree::-webkit-scrollbar-track, .agent__log::-webkit-scrollbar-track,
.pad::-webkit-scrollbar-track { background: transparent; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ==========================================================================
   顶栏 —— iOS 大导航栏：半透明白 + 高斯模糊 + 发丝线
   ========================================================================== */
.top {
  height: var(--header-h); flex: 0 0 auto; display: flex; align-items: center;
  gap: var(--space-4); padding: 0 var(--space-4);
  border-bottom: 1px solid var(--color-border-subtle);
  background: rgba(255, 255, 255, .72);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
}
.top__proj {
  font-size: 13px; font-weight: 600; color: var(--color-text-primary);
  max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 步骤导航：iOS 分段控件，绝对居中于顶栏 */
.top { position: relative; }
.top__nav { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.top__tools { display: flex; gap: 6px; margin-left: var(--space-3); }
.top__tools .tbtn { padding: 0 9px; }
.top__tools .tbtn[aria-current="true"] { color: var(--color-accent); border-color: var(--color-accent); background: var(--color-accent-soft); }

/* 顶栏控件：胶囊 */
.credit {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px;
  border-radius: var(--radius-full); font-size: 12px; font-weight: 600;
  background: var(--color-accent-soft); color: var(--color-accent);
  font-variant-numeric: tabular-nums; border: 0; font-family: inherit; cursor: pointer;
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.credit:hover { background: var(--color-accent); color: var(--color-on-accent); }
.credit svg { width: 13px; height: 13px; }
.tbtn {
  height: 28px; padding: 0 12px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500;
  border: 1px solid var(--color-border-default); background: transparent;
  color: var(--color-text-secondary); font-family: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.tbtn:hover { background: rgba(0,0,0,.05); color: var(--color-text-primary); }
.tbtn svg { width: 14px; height: 14px; }
.ava {
  width: 28px; height: 28px; border-radius: 999px; background: var(--neutral-100);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  color: var(--neutral-500); flex: 0 0 auto;
}

/* ==========================================================================
   工作区骨架
   ========================================================================== */
.work { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 320px; }
.work--full { grid-template-columns: minmax(0,1fr); }
.stage { min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--color-bg-canvas); }
.stage__bar {
  height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-5); border-bottom: 1px solid var(--color-border-subtle);
  background: rgba(255, 255, 255, .72);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
}
.stage__title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.stage__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

.doc { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); }
.pad { padding: var(--space-5) var(--space-6) var(--space-12); }

/* ==========================================================================
   块式文档 —— Apple Pages 式纯白卡 + 发丝线
   ========================================================================== */
.blk { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-card); margin-bottom: var(--space-3); background: var(--color-bg-surface); }
.blk__bar {
  display: flex; align-items: center; gap: 6px; padding: 8px var(--space-5);
  border-bottom: 1px solid var(--color-border-subtle); font-size: 12px; color: var(--color-text-tertiary);
}
.blk__bar svg { width: 14px; height: 14px; }
.blk__hint { margin-left: auto; opacity: 0; transition: opacity var(--duration-fast) var(--ease-standard); }
.blk:hover .blk__hint { opacity: 1; }
.blk__body { padding: var(--space-5) var(--space-6) var(--space-6); }
.blk h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 var(--space-4); }
.blk h3 { font-size: 16px; font-weight: 600; margin: var(--space-6) 0 var(--space-2); }
.blk h3:first-child { margin-top: 0; }
.blk p { font-size: 14px; line-height: 1.95; color: var(--color-text-secondary); margin: 0 0 var(--space-4); }
.blk p:last-child { margin-bottom: 0; }
.blk .sc { font-size: 14px; font-weight: 600; margin: var(--space-5) 0 4px; }
.blk .meta { font-size: 13px; color: var(--color-text-tertiary); margin: 0 0 var(--space-2); }
.blk .ln { font-size: 14px; line-height: 1.95; color: var(--color-text-secondary); margin: 0; }
.blk__edit {
  width: 100%; min-height: 240px; background: var(--neutral-50); color: var(--color-text-primary);
  border: 1px solid var(--color-border-default); border-radius: var(--radius-control);
  padding: var(--space-4); font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px; line-height: 1.9; resize: vertical;
}
.blk__edit:focus { outline: none; border-color: var(--color-accent); box-shadow: var(--shadow-focus); }

/* 剧本文档 —— Apple 备忘录 / Pages 阅读栏（仅作用于 .doc 内的块） */
.doc { max-width: 760px; }
.doc .blk { border-radius: 14px; margin-bottom: var(--space-4); box-shadow: var(--shadow-card); }
.doc .blk__bar { gap: 10px; padding: 12px 18px; font-size: 13px; color: var(--color-text-primary); }
.doc .blk__bar > svg { display: none; }
.doc .blk__ico { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: var(--color-accent-soft); color: var(--color-accent); flex: 0 0 auto; }
.doc .blk__bar > span:not(.blk__ico):not(.blk__hint) { font-size: 13px; font-weight: 600; }
.doc .blk__hint { color: var(--color-text-tertiary); }
.doc .blk__body { padding: 20px 22px 24px; }
.doc .blk h2 { font-size: 22px; font-weight: 700; }
.doc .blk h3 { font-size: 17px; }
.doc .blk p { font-size: 15px; line-height: 1.95; }
.doc .blk .sc { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin: var(--space-5) 0 6px; }
.doc .blk .ln { font-size: 15px; }
.doc .blk__edit { font-size: 14px; }

/* 剧本文档分段控件 —— iOS UISegmentedControl */
.segwrap { position: sticky; top: 0; z-index: 6; display: flex; justify-content: center; padding: 10px var(--space-6) 8px; background: var(--color-bg-canvas); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(120,120,128,.12); }
.seg button { appearance: none; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--color-text-primary); padding: 8px 32px; border-radius: 9px; cursor: pointer; transition: background .18s, box-shadow .18s, font-weight .18s; white-space: nowrap; letter-spacing: .02em; }
.seg button[aria-selected="true"] { background: var(--color-bg-surface); box-shadow: 0 3px 10px rgba(0,0,0,.14), 0 .5px 1px rgba(0,0,0,.06); font-weight: 600; }
.seg button:active { color: var(--color-text-secondary); }

/* 数据页 —— Apple 仪表盘组件 */
.mhero__ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
.mhero__ring svg { display: block; }
.mhero__num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mhero__num span { line-height: 1; }
.mhero__num b { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mhero__num i { font-style: normal; font-size: 15px; font-weight: 600; margin-left: 1px; }
.mhero__num em { font-style: normal; font-size: 11px; color: var(--color-text-tertiary); margin-top: 5px; }
.mstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mstat { background: var(--neutral-50); border-radius: 10px; padding: 10px 14px 12px; }
.mstat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.mstat u { text-decoration: none; font-size: 12px; font-weight: 400; color: var(--color-text-tertiary); margin-left: 3px; }
.mcharts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.minsight { display: flex; gap: 7px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--color-accent-soft); color: var(--color-text-primary); font-size: 13px; line-height: 1.7; }
.minsight svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--color-accent); margin-top: 3px; }
.mstep { padding: 13px 0 12px; }
.mstep--line { border-bottom: 1px solid var(--color-border-subtle); }
.mstep__n { font-size: 14px; font-weight: 600; width: 150px; flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px; }
.mstep__n small { font-size: 11px; font-weight: 400; color: var(--color-text-tertiary); }
.mstep__track { height: 3px; border-radius: 999px; background: var(--color-bg-muted); margin-top: 11px; overflow: hidden; }
.mstep__fill { height: 100%; border-radius: 999px; background: var(--color-accent); transition: width .5s var(--ease-standard); }

/* ==========================================================================
   资源管理器 —— macOS 源列表：灰底 + 选中蓝底白字
   ========================================================================== */
.expl { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: 100%; min-height: 0; }
.expl__tree { border-right: 1px solid var(--color-border-subtle); background: var(--color-bg-sidebar); overflow-y: auto; padding: var(--space-3); }
.expl__head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px; }
.expl__act { margin-bottom: 2px; }
.expl__act summary {
  display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: var(--radius-chip);
  font-size: 13px; font-weight: 600; color: var(--color-text-primary); cursor: pointer; user-select: none;
  list-style: none;
}
.expl__act summary:hover { background: var(--color-bg-hover); }

.expl__chev { width: 13px; height: 13px; flex: 0 0 auto; color: var(--color-text-tertiary); transition: transform var(--duration-fast) var(--ease-standard); }

.expl__span { font-size: 11px; font-weight: 400; color: var(--color-text-tertiary); flex: 0 0 auto; }

.expl__item {

.expl__alt {
  display: flex; gap: 8px; align-items: flex-start; margin: 2px 8px 2px 28px; padding: 6px 0 6px 12px;
  border-left: 1px dashed var(--color-border-default);
  font-size: 12px; line-height: 1.7; color: var(--color-text-tertiary);
}
.expl__alt .pill { flex: 0 0 auto; }
.expl__view { overflow-y: auto; padding: var(--space-6) var(--space-8); }

.pv-shot { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--color-border-subtle); cursor: pointer; }
.pv-shot:last-child { border-bottom: 0; }
.pv-shot:hover .pv-shot__d { color: var(--color-text-primary); }
.pv-shot__d { flex: 1; min-width: 0; font-size: 12px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color var(--duration-fast) var(--ease-standard); }

/* 资产树行：缩略图 + 名称 + 状态 */

/* 预览区的形状照小卡条 */
.expv {

  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}

/* 弹窗表单 */

}

/* ==========================================================================
   按钮 —— 胶囊形；主按钮纯色 systemBlue、无渐变无彩影
   ========================================================================== */

/* ==========================================================================

.card {
  border: 1px solid var(--color-border-subtle); border-radius: var(--radius-card);

  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}

/* 图标底 chip —— Apple 柔和的彩色圆角方底 */

}

/* ==========================================================================

.styles { display: flex; gap: 6px; flex-wrap: wrap; }
.sty {
  font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--radius-full); cursor: pointer;

}

/* ==========================================================================
   分镜运行台 —— iMessage 式输入框 + 参数行
   ========================================================================== */
.runbar { border: 1px solid var(--color-border-default); border-radius: 16px; background: var(--color-bg-surface); overflow: hidden; }

}

}

}

.runbar__sel:focus { outline: none; box-shadow: var(--shadow-focus); }
.sb__pic { cursor: pointer; overflow: hidden; transition: box-shadow var(--duration-fast) var(--ease-standard); }
.sb__pic:hover { box-shadow: 0 0 0 2px var(--color-accent); }
/* 列表行内的单镜运行按钮 */
.expl__run {
  display: flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border-radius: 999px; color: var(--color-text-tertiary); flex: 0 0 auto; cursor: pointer;
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.expl__run:hover { background: var(--color-accent); color: var(--color-on-accent); }
.expl__run svg { width: 11px; height: 11px; }

/* ==========================================================================
   剪辑时间轴
   ========================================================================== */
.edit { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: var(--space-5); padding: var(--space-5) var(--space-6); }
@media (max-width: 1400px) { .edit { grid-template-columns: 1fr; } }
.player { background: #000; border-radius: var(--radius-card); aspect-ratio: 9/16; max-height: 340px; margin: 0 auto; overflow: hidden; position: relative; }
.player svg, .player img, .player video { display: block; width: 100%; height: 100%; object-fit: cover; }
.tl { margin-top: var(--space-5); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-card); padding: var(--space-4); background: var(--color-bg-surface); }

.tl__clip {
  height: 42px; border-radius: 7px; cursor: pointer; overflow: hidden; position: relative;

}

.tl__clip svg, .tl__clip img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.tl__clip span { position: absolute; left: 4px; bottom: 2px; font-size: 9px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.tl__aud { height: 24px; border-radius: 6px; background: var(--color-accent-soft); border: 1px solid var(--color-accent); flex: 0 0 auto; opacity: .9; }
.tl__sub { height: 20px; border-radius: 6px; background: var(--color-bg-muted); border: 1px solid var(--color-border-default); flex: 0 0 auto; font-size: 9px; color: var(--color-text-tertiary); padding: 0 4px; overflow: hidden; white-space: nowrap; line-height: 18px; }

/* ==========================================================================
   Agent 侧栏 —— iOS 分组列表 + iMessage 气泡
   ========================================================================== */
.agent { border-left: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; min-height: 0; background: var(--color-bg-sidebar); }
.agent__h { height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border-bottom: 1px solid var(--color-border-subtle); }
.agent__log { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--space-5) var(--space-4); }
.agent__hi { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: var(--space-4); }
.agent__lead { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.45; margin-bottom: var(--space-5); }
.skill {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 1px solid var(--color-border-subtle); background: var(--color-bg-surface); color: var(--color-text-primary);
  font-family: inherit; font-size: 13px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-tile);
  margin-bottom: 8px; cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}
.skill:hover { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }

.amsg { font-size: 13px; line-height: 1.7; margin-bottom: var(--space-3); }
.amsg--me { color: var(--color-on-accent); background: var(--color-accent); padding: 8px 14px; border-radius: 16px; border-bottom-right-radius: 4px; max-width: 92%; }
.amsg--ai { color: var(--color-text-secondary); }
.agent__dock { flex: 0 0 auto; padding: var(--space-4); border-top: 1px solid var(--color-border-subtle); }
.agent__in {
  border: 1px solid var(--color-border-default); border-radius: 18px;
  padding: 10px 12px; background: var(--color-bg-surface);
}
.agent__in:focus-within { border-color: var(--color-border-strong); box-shadow: var(--shadow-focus); }
.agent__in textarea {
  width: 100%; border: 0; background: transparent; color: var(--color-text-primary);

}

.send {
  width: 28px; height: 28px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--color-accent); color: #fff; display: flex; align-items: center; justify-content: center;
}
.send:hover { background: var(--color-accent-hover); }
.send svg { width: 14px; height: 14px; }

/* ==========================================================================
   首页 —— macOS 大标题 + Apple TV 式 Hero 卡 + 彩色模式卡
   ========================================================================== */
.home { max-width: 1000px; margin: 0 auto; padding: var(--space-10) var(--space-6) var(--space-12); }
.home__t { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }

/* 主通道 Hero：大图 + 左下白字 + 磨砂圆形前进按钮，hover 图片缓慢放大 */
.hero {
  position: relative; height: 264px; border-radius: 16px; overflow: hidden;
  cursor: pointer; margin-bottom: var(--space-5);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
}
.hero img.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 600ms var(--ease-standard); }
.hero:hover img.ph { transform: scale(1.04); }
.hero__scrim { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(15,15,20,.62) 0%, rgba(15,15,20,.30) 48%, rgba(15,15,20,0) 76%); }
.hero__b { position: absolute; left: 24px; bottom: 22px; right: 84px; color: #fff; }
.hero__tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;

}

.hero__t { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.hero__d { font-size: 13px; color: rgba(255,255,255,.85); margin-top: 4px; }
.hero__go {
  position: absolute; right: 20px; bottom: 20px; width: 36px; height: 36px; border-radius: 999px;

}
.hero:hover .hero__go { background: #fff; transform: scale(1.06); }
.hero__go svg { width: 16px; height: 16px; }

/* 次级模式卡：各自浅色 tinted 底 + 实心彩色图标，一眼区分 */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-10); }
.mode-c {
  border: 1px solid transparent; border-radius: var(--radius-card);
  padding: var(--space-5); cursor: pointer;
  transition: transform var(--duration-base) var(--ease-standard), box-shadow var(--duration-base) var(--ease-standard);
}
.mode-c--1 { background: var(--color-data-1-soft); }
.mode-c--2 { background: var(--color-data-2-soft); }

/* ==========================================================================

.s3d { width:260px; height:230px; perspective:820px; perspective-origin:50% 42%;

/* 地面网格 */
.s3d__g { position:absolute; left:50%; top:50%; width:250px; height:250px; margin:-125px 0 0 -125px;
  transform:rotateX(90deg) translateZ(-42px); transform-style:preserve-3d;
  background:

  border-radius:50%; opacity:.5; transform-style:preserve-3d; }

/* 主体：一个有正面的小方块，一眼看出摄影机绕到了哪一侧 */
.s3d__box { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;

		KHR_MATERIALS_PBR_SPECULAR_GLOSSINESS: 'KHR_materials_pbrSpecularGlossiness',

11 岁的艾米生活在美国纽约郊区，陪伴她成长的只有一只名叫"年糕"的白猫。某一天，年糕突然生病被送往宠物医院，第二天艾米发现所有关于年糕的记录都消失了——没有医生记得它，家中的照片和记忆里关于它的痕迹也正在消失。为了找回年糕，艾米追寻古埃及遗留下来的神秘线索，发现人类世界是一场由猫共同编织的梦境。她最终在梦境深处的猫神殿找到了年糕，此时的年糕已经成为新的造梦者。在最后的告别中，艾米明白了真正的爱并不是永远拥有，她放开了年糕。`},

`# 第一幕：不会离开的朋友（0:00–1:20）

**场景1**
美国纽约郊区 · 黄昏 · 小女孩房间

桌上摆着一张旧照片：照片里，小女孩抱着一只白猫。
旁白："小时候，我总觉得世界上有些东西永远不会改变。"

年糕趴在桌边睡觉，艾米放下画笔，揉了揉它的头。
艾米："年糕，你答应我，以后不要离开我。"
年糕睁开眼，看了她一眼，轻轻用额头碰了一下她的手。

额头相碰的一瞬间，一粒非常微弱的蓝绿色光点进入艾米额头。只持续一帧，几乎不会被注意。

   不这么算的话，切到 16:9 会沿用竖画幅的视场角，取景直接错。 */
const RATIOS = [
  ['9:16', 9/16,  '竖屏短剧'],
  ['3:4',  3/4,   '竖版绘本'],
  ['4:5',  4/5,   '社交竖图'],

const ratioVal = r => (RATIOS.find(x => x[0] === r) || RATIOS[0])[1];
const sensorH  = ar => ar < 1 ? 36 : 36 / ar;      // 画面高度对应的传感器尺寸
const ratioFrag = r => ({'9:16':'vertical 9:16 framing','3:4':'3:4 portrait framing',
  '4:5':'4:5 portrait framing','1:1':'square 1:1 framing','4:3':'4:3 framing',
  '16:9':'widescreen 16:9 framing','2.39:1':'anamorphic 2.39:1 widescreen'}[r] || 'vertical 9:16 framing');

/* 预览框固定 PREV_BOX 见方，画幅按比例内接，四周留黑边 —— 和监视器一个逻辑 */
const PREV_BOX = 400;
function prevSize(r){
  const ar = ratioVal(r);
  const w = ar >= 1 ? PREV_BOX : Math.round(PREV_BOX * ar);
  const h = ar >= 1 ? Math.round(PREV_BOX / ar) : PREV_BOX;
  return {w, h, ar};
}

const SHOT_R = [720, 300, 109, 65, 46, 29, 16];

const EYE_Y = 38;
/* 舞台上的轨道半径：必须和 SHOT_R 同方向，16–720 的跨度画不下，取对数压到 42–132 */
const rigRadius = d => {
  const r = SHOT_R[Math.round(Math.max(0, Math.min(6, d ?? 2)))] || 109;
  const t = (Math.log(r) - Math.log(16)) / (Math.log(720) - Math.log(16));
  return 42 + 90 * t;
};
const CAM_ORD   = ['固定','推镜','跟镜','手持'];
const DOF_ORD   = ['深景深','中等','浅景深'];

/* 人物占画幅高度的倍数：>1 表示已经被画框裁切 */
const FIG = {'大远景':0.10,'远景':0.24,'全景':0.66,'中景':1.10,'中近景':1.55,'近景':2.5,'特写':4.4};

function framePreview(s, w = 132){
  const W = 90, H = 160;
  const size = s.size || '全景', dof = s.dof || '中等', cam = s.cam || '固定';
  /* 俯仰与方位优先用连续量（机位弹窗拖出来的 el/az），
     意图卡这类离散配置再从标签反推 —— 之前只认离散标签，拖俯仰时它一动不动 */
  const el = s.el ?? (s.angle === '俯拍' ? 38 : s.angle === '仰拍' ? -26 : 0);
  const az = s.az ?? (s.angle === '过肩' ? 150 : 0);
  const elLab = el < -18 ? '仰拍' : el < -6 ? '略仰' : el <= 10 ? '平视' : el <= 28 ? '略俯' : '俯拍';
  const fh = (FIG[size] || 0.66) * H;
  const eye = clamp(0.42 - el * 0.0029, 0.26, 0.58) * H;
  /* 方位：正侧面人物收窄，鼻尖偏移指示朝向，背面看不到鼻尖 */
  const face = Math.cos(az * D2R), side = Math.sin(az * D2R);
  const wScale = 0.42 + 0.58 * Math.abs(face);
  /* 一个脚踩地面的完整人形：头、肩、躯干、两条腿。
     远景整人可见，近景以上被画框自然裁切 —— 不再是悬空头 + 底部黑弧。
     俯拍时从头顶往下看：头占比变大、躯干和腿纵向压缩，强俯角腿被吃掉 */
  const pitchF = clamp(el / 55, 0, 1);
  const headR = fh * 0.075 * (1 + 0.35 * pitchF);
  const footY = eye + fh * 0.92;
  const topY = footY - fh;
  const headCY = topY + headR;
  const headRx = headR * 0.82 * (0.55 + 0.45 * Math.abs(face));
  const bodyF = 1 - 0.5 * pitchF;
  const shoulderY = topY + headR * 2.3, shoulderW = fh * 0.17 * wScale * (1 + 0.2 * pitchF);
  const hipY = shoulderY + (topY + fh * 0.52 - shoulderY) * bodyF, hipW = fh * 0.125 * wScale;
  const legW = Math.max(fh * 0.05 * wScale, 0.8), legGap = Math.max(fh * 0.02, 0.6);
  const legH = Math.max((footY - hipY + 1) * (1 - pitchF), 0), legOp = 0.88 * (1 - pitchF * 0.9);
  const blur = dof === '浅景深' ? 2.6 : dof === '中等' ? 1.0 : 0;
  const ground = clamp(0.66 - el * 0.004, 0.50, 0.82) * H;
  const uid = 'f' + Math.abs([...String(s.id||'x')].reduce((a,c)=>a*31+c.charCodeAt(0),7) % 99999);
  const subjCX = s.angle === '过肩' ? 58 : 45;

  const arrows = cam === '推镜'
    ? `<g stroke="var(--color-accent)" stroke-width="1.4" fill="none" opacity=".85">
         <path d="M8 8 L20 20 M8 8 L8 15 M8 8 L15 8"/><path d="M82 8 L70 20 M82 8 L82 15 M82 8 L75 8"/>
         <path d="M8 152 L20 140 M8 152 L8 145 M8 152 L15 152"/><path d="M82 152 L70 140 M82 152 L82 145 M82 152 L75 152"/></g>`
    : cam === '跟镜'
    ? `<g stroke="var(--color-accent)" stroke-width="1.6" fill="none" opacity=".85">
         <path d="M62 150 L78 150 M72 145 L78 150 L72 155"/></g>`
    : cam === '手持'
    ? `<g stroke="var(--color-accent)" stroke-width="1.3" fill="none" opacity=".8">
         <path d="M10 150 q4 -6 8 0 t8 0"/><path d="M64 150 q4 -6 8 0 t8 0"/></g>`
    : '';

  /* 主观视角没有人；顶拍只剩头顶和肩膀；过肩带前景肩膀 */
  const figure = s.angle === '主观' ? '' : s.angle === '顶拍'
    ? `<g fill="var(--color-text-primary)" opacity=".88">
        <ellipse cx="45" cy="${H*0.52}" rx="${headR*2.6}" ry="${headR*2.0}"/>
        <ellipse cx="45" cy="${H*0.52}" rx="${headR*0.95}" ry="${headR*0.95}" fill="var(--color-accent)"/>
      </g>`
    : `<g fill="var(--color-text-primary)" opacity=".88">
        <ellipse cx="${subjCX}" cy="${headCY}" rx="${headRx}" ry="${headR}"/>
        ${face >= -0.2 && headR >= 5 ? `<ellipse cx="${subjCX + side * headRx * 1.05}" cy="${headCY}" rx="${(headR*0.22).toFixed(1)}" ry="${(headR*0.3).toFixed(1)}" fill="var(--color-accent)"/>` : ''}
        <path d="M${subjCX-shoulderW} ${shoulderY} Q${subjCX} ${shoulderY-headR*0.5} ${subjCX+shoulderW} ${shoulderY}
                 L${subjCX+hipW} ${hipY} L${subjCX-hipW} ${hipY} Z"/>
        ${legH > 0.5 ? `<g opacity="${legOp.toFixed(2)}">
          <rect x="${subjCX-legGap-legW}" y="${hipY-1}" width="${legW}" height="${legH}" rx="${legW*0.4}"/>
          <rect x="${subjCX+legGap}" y="${hipY-1}" width="${legW}" height="${legH}" rx="${legW*0.4}"/>
        </g>` : ''}
      </g>`;
  const shoulder = s.angle === '过肩'
    ? `<ellipse cx="8" cy="${H+6}" rx="30" ry="46" fill="var(--color-text-primary)" opacity=".55" filter="${blur?`url(#${uid}b)`:''}"/>`
    : '';
  const tilt = s.angle === '荷兰角' ? ' transform="rotate(-8 45 80)"' : '';

  return `<svg viewBox="0 0 ${W} ${H}" width="${w}" style="display:block;border-radius:8px;background:var(--color-bg-muted)" role="img"
    aria-label="取景示意：${size}、${elLab}、${dof}、${cam}">
    <defs>
      <filter id="${uid}b"><feGaussianBlur stdDeviation="${blur}"/></filter>
      <clipPath id="${uid}c"><rect width="${W}" height="${H}" rx="6"/></clipPath>
    </defs>
    <g clip-path="url(#${uid}c)">
     <g${tilt}>
      <rect width="${W}" height="${H}" fill="var(--color-bg-muted)"/>
      <g filter="${blur?`url(#${uid}b)`:''}" opacity=".55">
        <rect y="${ground}" width="${W}" height="${H-ground}" fill="var(--color-border-default)"/>
        <rect x="6"  y="${ground-26}" width="16" height="26" rx="2" fill="var(--color-border-strong)" opacity=".7"/>
        <rect x="70" y="${ground-34}" width="14" height="34" rx="2" fill="var(--color-border-strong)" opacity=".55"/>
      </g>
      ${shoulder}
      ${figure}
      <g stroke="var(--color-border-strong)" stroke-width=".5" opacity=".35">
        <path d="M30 0 V${H} M60 0 V${H} M0 ${H/3} H${W} M0 ${H*2/3} H${W}"/>
      </g>
      ${arrows}
     </g>
    </g>
    <rect width="${W}" height="${H}" rx="6" fill="none" stroke="var(--color-border-strong)" stroke-width="1"/>
  </svg>`;
}

/* ============================================================ 三个专属弹窗
   主界面只留取景框和入口；每个决策进到自己的空间里，用直接操纵而不是滑块。 */
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================ 真 3D 场景
   全部用 CSS transform + preserve-3d。拖拽实时更新 transform，
   点预设时加过渡类，让它动画过去而不是瞬移。 */
const V = {rig:{vx:20, vy:-26}, lit:{vx:14, vy:-18}};

/* ============================================================ 机位场景 · Three.js
   网格地面 + 带正面朝向的人物 + 轨道环 + 摄影机模型与取景锥线。
   拖拽画布直接操纵机位（横=方位，纵=俯仰），右上角切换观察视角。
   Three.js 加载失败时回退到原来的 CSS 版。 */

function rigScene(s){
  if (window.THREE) {
    return `<div class="s3d" id="rig3d" style="width:380px;height:380px;padding:0">
      <canvas id="rigcanvas" width="380" height="380"
        style="width:380px;height:380px;display:block;touch-action:none;cursor:grab"></canvas>
      <div class="s3d__vt">
        <button data-cview="rig|20|-26" aria-pressed="${V.rig.vx===20}">透视</button>
        <button data-cview="rig|78|0" aria-pressed="${V.rig.vx===78}">俯视</button>
        <button data-cview="rig|2|0" aria-pressed="${V.rig.vx===2}">正面</button>
      </div>
      <div class="s3d__hud" id="righud">${distName(s.dist)} · ${azName(s.az)} · ${elName(s.el)}</div>
    </div>`;
  }
  return rigSceneCSS(s);
}

/* 文字小牌子：canvas 画字 → Sprite，始终面向观察者；pill 给白底药丸 */
function textSprite3D(text, w = 34, color = '#86868b', pill = false){
  const c = document.createElement('canvas'); c.width = 256; c.height = 112;
  const g = c.getContext('2d');
  const draw = t => { g.clearRect(0,0,256,112);
    if (pill){ g.fillStyle = 'rgba(255,255,255,.92)';
      g.beginPath(); g.roundRect(18, 20, 220, 72, 36); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.stroke(); }
    g.font = '600 44px -apple-system, "PingFang SC", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = color; g.fillText(t, 128, 58); };
  draw(text);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false}));
  sp.scale.set(w, w * 112 / 256, 1);
  return { sp, redraw: t => { draw(t); tex.needsUpdate = true; } };
}

/* 回退白模（参数化）：GLB 拉不到时用它顶上，保证不白屏。原注释：车削出真实轮廓（肩宽—收腰—胯宽），四肢分段带关节，站姿有重心偏移。
   总高固定 51，与场景里的 lookAt(0,26,0) 和机位半径保持一致。机位场景与实拍预览共用。 */
function buildFigureFallback(){
  const clay = new THREE.MeshPhongMaterial({color: 0xf1f1f3, shininess: 8, specular: 0x2b2b32});
  const V2 = (x, y) => new THREE.Vector2(x, y);
  const lathe = pts => new THREE.LatheGeometry(pts.map(p => V2(p[0], p[1])), 28);
  const mesh = (geo, parent, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geo, clay);
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
    parent.add(m); return m;
  };
  const cyl = (rt, rb, h, seg = 16) => new THREE.CylinderGeometry(rt, rb, h, seg);

  const subj = new THREE.Group();

  /* 躯干：一条剖面线车出来，才有肩宽收腰的轮廓；再压扁前后径 */
  const torso = mesh(lathe([
    [0.6, 0], [3.4, 0.5], [4.6, 1.6], [5.0, 3.0],      // 胯
    [4.7, 5.0], [4.0, 7.2],                             // 腰
    [4.3, 9.2], [5.1, 11.6], [5.6, 13.6],               // 胸 / 肩
    [5.3, 15.0], [3.3, 16.0], [1.9, 16.5],              // 颈根
  ]), subj, 0, 25.5, 0);
  torso.scale.z = 0.58;
  torso.rotation.y = 0.05;

  mesh(cyl(1.55, 1.85, 2.6, 14), subj, 0, 43.2, 0).rotation.x = -0.05;   // 颈

  /* 头：下颌收、颅顶圆，前后略深 */
  const head = mesh(lathe([
    [0.4, 0], [1.2, 0.5], [2.0, 1.4], [2.5, 2.6],
    [2.72, 3.8], [2.62, 4.9], [2.1, 6.0], [1.0, 6.6], [0.2, 6.8],
  ]), subj, 0, 44.3, 0);
  head.scale.z = 1.16;
  head.rotation.y = 0.10;
  /* 鼻梁：同色，只做一点结构，不加任何彩色标记 */
  const nose = mesh(new THREE.ConeGeometry(0.52, 1.7, 12), head, 0.05, 3.6, 2.55);
  nose.rotation.set(Math.PI / 2 - 0.25, 0, 0);

  /* 手臂：肩 → 上臂 → 肘 → 前臂 → 手，左右不对称 */
  const arm = (side, abduct, elbow) => {
    const sh = new THREE.Group();
    sh.position.set(side * 5.3, 39.6, 0);
    sh.rotation.set(-0.05, 0, side * abduct);
    subj.add(sh);
    mesh(new THREE.SphereGeometry(1.9, 18, 14), sh, 0, 0.2, 0).scale.set(1, 0.9, 0.9); // 肩头
    mesh(cyl(1.55, 1.22, 9.6), sh, 0, -4.9, 0);
    const el = new THREE.Group();
    el.position.set(0, -9.7, 0); el.rotation.x = elbow;
    sh.add(el);
    mesh(cyl(1.22, 0.92, 8.8), el, 0, -4.4, 0);
    mesh(new THREE.SphereGeometry(1.15, 16, 12), el, 0, -9.3, 0).scale.set(0.78, 1.45, 0.42); // 手
  };
  arm(-1, 0.13, 0.20);
  arm( 1, 0.08, 0.32);

  /* 腿：重心偏右，左腿微屈外展 —— 不对称才像人站着 */
  const leg = (side, tilt, knee, footZ) => {
    const hip = new THREE.Group();
    hip.position.set(side * 2.5, 25.8, 0);
    hip.rotation.z = tilt;
    subj.add(hip);
    mesh(cyl(2.55, 1.9, 12.2), hip, 0, -6.1, 0);
    const kn = new THREE.Group();
    kn.position.set(0, -12.2, 0); kn.rotation.x = knee;
    hip.add(kn);
    mesh(new THREE.SphereGeometry(1.85, 16, 12), kn, 0, 0.1, 0).scale.set(1, 0.85, 0.95); // 膝
    mesh(cyl(1.85, 1.2, 11.6), kn, 0, -5.9, 0);
    mesh(new THREE.BoxGeometry(2.4, 1.5, 5.6), kn, 0, -12.2, footZ);   // 脚
  };
  leg(-1,  0.085, 0.13, 1.5);
  leg( 1, -0.035, 0.02, 1.3);

  subj.rotation.y = -0.03;
  return subj;
}

/* ============================================================ 真人白模（带骨骼）
   Mixamo X Bot：全套骨架 70 节点、含手指，自带 7 段动作。
   材质覆盖成石膏白；姿态直接从动画 clip 上采样，比手撸骨骼旋转自然得多。
   GLB 加载失败时回退到参数化白模，保证弹窗不会白屏。 */
const WM_URLS = [
  './Xbot.glb',                                                                   // 放在 HTML 同目录最省事（需经 http 打开）
  'https://fastly.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Xbot.glb',
  'https://gcore.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Xbot.glb',
  'https://cdn.statically.io/gh/mrdoob/three.js/dev/examples/models/gltf/Xbot.glb',
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Xbot.glb',
  'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Xbot.glb',
];
const WM_TRIED = [];
const WM_SKINS = [
  {k:'blue',  n:'蓝模', c:0x7f9ed4, d:'蓝灰，和浅色背景分得开，看结构最清楚'},
  {k:'grey',  n:'灰模', c:0xb9bac1, d:'中性灰，当参考图最安全，不会给画面带色'},
  {k:'white', n:'白模', c:0xececed, d:'石膏白，传统白模'},
];
let WM_SKIN = 'blue';
const wmColor = () => (WM_SKINS.find(x => x.k === WM_SKIN) || WM_SKINS[0]).c;
const FIG_H = 51;                 // 场景里约定的人物总高，换模型也要对齐
let WM_BUF = null, WM_PROMISE = null, WM_FAILED = false;
const WM_HOSTS = [];              // 所有等着塞模型的容器

function fetchWhiteModel(){
  if (WM_PROMISE) return WM_PROMISE;
  WM_PROMISE = new Promise((resolve, reject) => {
    if (!window.THREE || !THREE.GLTFLoader) return reject(new Error('no loader'));
    const fl = new THREE.FileLoader(); fl.setResponseType('arraybuffer');
    (function attempt(i){
      if (i >= WM_URLS.length) return reject(new Error('all sources failed'));
      fl.load(WM_URLS[i],
        buf => { WM_BUF = buf; WM_TRIED.push([WM_URLS[i], '成功']); resolve(buf); },
        undefined,
        () => { WM_TRIED.push([WM_URLS[i], '不可达']); attempt(i + 1); });
    })(0);
  });
  WM_PROMISE.catch(() => { WM_FAILED = true; });
  return WM_PROMISE;
}

/* 一份 buffer，多处 parse —— 每个场景要独立的骨架实例，不能共用同一个对象 */
function instanceWhiteModel(){
  return new Promise((resolve, reject) => {
    fetchWhiteModel().then(buf => {
      new THREE.GLTFLoader().parse(buf.slice(0), '', gltf => {
        const root = gltf.scene;
        const clay = new THREE.MeshPhongMaterial({
          color: wmColor(), shininess: 12, specular: 0x35353f, skinning: true,
        });
        root.userData.clay = clay;
        root.traverse(o => {
          if (o.isMesh || o.isSkinnedMesh){
            o.material = clay; o.castShadow = true; o.receiveShadow = true;
            o.frustumCulled = false;
          }
        });
        /* 蒙皮网格的 Box3 会被绑定矩阵坑（实测量出 0.018），改用骨骼世界坐标量身高 */
        const boneY = () => { let lo = Infinity, hi = -Infinity;
          root.updateMatrixWorld(true);
          root.traverse(o => { if (o.isBone){ const y = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).y;
            lo = Math.min(lo, y); hi = Math.max(hi, y); } });
          return {lo, hi, span: hi - lo}; };
        const m0 = boneY();
        root.scale.setScalar(FIG_H / Math.max(m0.span, 1e-6) * 1.06);   // 骨顶到发顶再留一点
        const m1 = boneY();
        root.position.y -= m1.lo;                          // 脚踩地
        const mixer = new THREE.AnimationMixer(root);
        resolve({root, mixer, clips: gltf.animations || []});
      }, reject);
    }).catch(reject);
  });
}

/* 姿态：clip 表示从哪段动作的哪一帧取，bones 是在此基础上的额外旋转（度） */
const POSES = [
  {k:'stand', n:'站立', d:'中性站姿', clip:'idle', t:0.6},
];
const poseOf = k => POSES.find(p => p.k === k) || POSES[0];

function applyPose(fig, poseKey){
  if (!fig || !fig.mixer) return;
  const p = poseOf(poseKey);
  fig.mixer.stopAllAction();
  const clip = fig.clips.find(c => c.name === p.clip) || fig.clips[0];
  if (clip){
    const act = fig.mixer.clipAction(clip);
    act.reset(); act.play(); act.paused = true; act.time = p.t;
    fig.mixer.setTime(p.t);
  }
  if (!fig.rest){                                   // 记住静止姿态，便于叠加时归位
    fig.rest = {};
    fig.root.traverse(o => { if (o.isBone) fig.rest[o.name] = o.rotation.clone(); });
  }
  if (p.bones){
    fig.root.traverse(o => {
      const d = o.isBone && p.bones[o.name];
      if (d) o.rotation.set(o.rotation.x + d[0]*D2R, o.rotation.y + d[1]*D2R, o.rotation.z + d[2]*D2R);
    });
  }
  fig.root.updateMatrixWorld(true);
}

/* 同步返回一个空 Group，模型到了再塞进去 —— 两个场景都用这个，不改调用方 */
function buildFigure(){
  const host = new THREE.Group();
  host.add(buildFigureFallback());               // 先放糙模，免得空白
  WM_HOSTS.push(host);
  instanceWhiteModel().then(fig => {
    host.remove(host.children[0]);
    host.add(fig.root);
    host.userData.fig = fig;
    applyPose(fig, (rigTarget && rigTarget() || {}).pose || 'stand');
    if (window.onWhiteModelReady) window.onWhiteModelReady();
  }).catch(() => {});
  return host;
}
/* 所有网络源都不通时的兜底：让用户自己把 GLB 丢进来 */
function useLocalGLB(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    WM_BUF = fr.result; WM_FAILED = false;
    WM_PROMISE = Promise.resolve(WM_BUF);
    WM_TRIED.push(['本地文件 ' + file.name, '成功']);
    const hosts = WM_HOSTS.slice();
    let done = 0;
    hosts.forEach(h => {
      instanceWhiteModel().then(fig => {
        while (h.children.length) h.remove(h.children[0]);
        h.add(fig.root); h.userData.fig = fig;
        applyPose(fig, (rigTarget && rigTarget() || {}).pose || 'stand');
        if (++done === hosts.length && window.onWhiteModelReady) window.onWhiteModelReady();
      }).catch(() => {});
    });
    toast('白模已就位 — 这次用的是你本地那份，不走网络');
  };
  fr.readAsArrayBuffer(file);
}

function setWhiteModelSkin(k){
  WM_SKIN = k;
  WM_HOSTS.forEach(h => { const f = h.userData.fig;
    if (f && f.root.userData.clay) f.root.userData.clay.color.setHex(wmColor()); });
}
function setFigurePose(poseKey){
  WM_HOSTS.forEach(h => h.userData.fig && applyPose(h.userData.fig, poseKey));
}

/* ============================================================ 姿态参考图
   用和实拍预览同一台相机渲染，所以导出的图就是这一镜真正的取景。
   输出 720×1280：满足参考图 ≥300px、宽高比 0.4–2.5 的硬约束。 */
const POSEREF = {w: 720, h: 1280};

function exportPoseRef(s){
  if (!window.THREE) return null;
  const ar = clamp(ratioVal(s.ratio || '9:16'), 0.4, 2.5);   // 参考图接口的硬约束
  const w = ar >= 1 ? 1280 : Math.round(1280 * ar);
  const h = ar >= 1 ? Math.round(1280 / ar) : 1280;
  POSEREF.w = Math.max(300, w); POSEREF.h = Math.max(300, h);
  if (typeof renderShotView === 'function') return renderShotView(s, POSEREF.w, POSEREF.h, null);
  const st = stage(); if (!st) return null;
  const {renderer, scene, cam} = st;
  renderer.setSize(POSEREF.w, POSEREF.h, false);
  cam.aspect = POSEREF.w / POSEREF.h;
  aimCam(s, cam);
  renderer.render(scene, cam);
  let url = null;
  try { url = renderer.domElement.toDataURL('image/png'); } catch (e) {}
  renderer.setSize(360, 640, false);
  cam.aspect = 9 / 16; cam.updateProjectionMatrix();

}

+ ` translateZ(${(R*Math.cos(s.lightEl*D2R)).toFixed(1)}px) rotateY(${(-s.lightAz).toFixed(1)}deg) rotateX(${(-V.lit.vx).toFixed(0)}deg)`;

/* 拖拽：横向改方位，纵向改高度。不重绘，只改 transform */
function bind3D(){
  const s = rigTarget(); if (!s) return;
  const setup = (id, get, set, paint) => {
    const el = document.getElementById(id); if (!el) return;
    let on = false, px = 0, py = 0, a0 = 0, e0 = 0;
    el.addEventListener('pointerdown', ev => {
      on = true; el.classList.remove('s3d--ease'); el.setPointerCapture(ev.pointerId);
      px = ev.clientX; py = ev.clientY; [a0, e0] = get();
    });
    el.addEventListener('pointermove', ev => {
      if (!on) return;
      set(a0 + (ev.clientX - px) * 0.85, e0 - (ev.clientY - py) * 0.55);
      paint();
    });
    el.addEventListener('pointerup', () => { on = false; el.classList.add('s3d--ease'); });
  };

  setup('rig3d', () => [s.az, s.el], (a, e) => {
    s.az = ((a + 180) % 360 + 360) % 360 - 180;
    s.el = clamp(e, RIG.el.min, RIG.el.max);
  }, () => paintRig(s));

  setup('lit3d', () => [s.lightAz, s.lightEl], (a, e) => {
    s.lightAz = ((a + 180) % 360 + 360) % 360 - 180;
    s.lightEl = clamp(e, -35, 60);
  }, () => paintLit(s));

  paintShotPreviews(s);
}

function paintLit(s){
  const R = 96;
  const warm = s.kelvin < 4600 ? '#F2B679' : s.kelvin > 6200 ? '#9AC4E8' : '#FFF3DC';
  const root = document.getElementById('lit3d');

    if (v) v.textContent = s[k] + (k==='bright'?'%':'K'); });
}

/* ============================================================ 光照 3D 场景
   和机位场景同一套路数：真 Three.js 渲染，光真的打在白模身上，
   拖拽绕人转光。这比画一个光锥有用得多 —— 你看到的就是结果。 */

/* 色片：影视常用的几种，外加自定义取色 */
const GELS = [
  {k:'none',    n:'无色',   c:'#FFFFFF', f:''},
  {k:'amber',   n:'琥珀',   c:'#FFB14E', f:'warm amber gel'},
  {k:'sunset',  n:'日落橙', c:'#FF7A45', f:'sunset orange light'},
  {k:'magenta', n:'品红',   c:'#FF5FA2', f:'magenta gel'},
  {k:'cyan',    n:'青',     c:'#4FD1D9', f:'cyan gel'},
  {k:'blue',    n:'电光蓝', c:'#4A7CFF', f:'electric blue light'},
  {k:'violet',  n:'紫',     c:'#9B6BFF', f:'violet gel'},
  {k:'mint',    n:'薄荷绿', c:'#5FD68B', f:'mint green light'},
  {k:'red',     n:'血红',   c:'#E8384F', f:'deep red light'},
];
const gelOf = k => GELS.find(g => g.k === k) || GELS[0];

/* 色温 → RGB，用于把白平衡也画进画面 */
function kelvinRGB(k){
  const t = k / 100;
  const f = (v) => clamp(v, 0, 255) / 255;
  let r, g, b;
  if (t <= 66){ r = 255; g = 99.47 * Math.log(t) - 161.12; }
  else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.52 * Math.log(t - 10) - 305.04;
  return new THREE.Color(f(r), f(g), f(b));
}
/* 主光最终颜色 = 色温 × 色片（或自定义色） */
function keyColor(s){
  const base = kelvinRGB(s.kelvin || 5600);
  const hex = s.gel === 'custom' ? (s.gelHex || '#ffffff') : gelOf(s.gel || 'none').c;
  return base.clone().multiply(new THREE.Color(hex));
}
const rimColor = s => new THREE.Color(s.rimHex || '#8FB8FF');

/* 自定义色 → 一句能进提示词的描述。纯 JS 实现：提示词生成不能依赖 WebGL */
function hueName(hex){
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(String(hex || '#ffffff'));
  if (!m) return 'neutral white light';
  const r = parseInt(m[1],16)/255, g = parseInt(m[2],16)/255, b = parseInt(m[3],16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, dd = mx-mn;
  const sat = dd === 0 ? 0 : dd / (1 - Math.abs(2*l - 1));
  if (sat < 0.12) return l > 0.6 ? 'neutral white light' : 'dim neutral light';
  let h;
  if (mx === r) h = ((g-b)/dd) % 6; else if (mx === g) h = (b-r)/dd + 2; else h = (r-g)/dd + 4;
  h = (h * 60 + 360) % 360;
  const n = h < 15 ? 'red' : h < 40 ? 'orange' : h < 68 ? 'amber yellow' : h < 160 ? 'green'
    : h < 195 ? 'cyan' : h < 250 ? 'blue' : h < 290 ? 'violet' : h < 330 ? 'magenta' : 'red';
  return `${n}-tinted light`;
}
const gelFrag = s => s.gel === 'custom' ? hueName(s.gelHex || '#ffffff') : gelOf(s.gel || 'none').f;


/* ============================================================ 布光台（机位 + 灯光合一）
   一个 Three 场景，两台相机渲两次：左边舞台俯瞰、右边摄影机实际取景。
   白模只加载一份，灯是真灯 —— 转机位就能看到顺光变逆光。
   渲取景图时把所有指示物藏起来，同一套场景直接当姿态参考图用。 */
let ST3 = null;
const STAGE_EYE = 38;

function buildStage3D(){
  if (ST3 && ST3.renderer) return ST3;
  const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(380, 380, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const bg = (() => { const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(256, 190, 30, 256, 300, 380);
    gr.addColorStop(0, '#6e717c'); gr.addColorStop(0.55, '#4e515b'); gr.addColorStop(1, '#2b2d34');
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512); return new THREE.CanvasTexture(c); })();
  scene.background = bg;
  scene.fog = new THREE.Fog(0x34363e, 900, 3000);

  const amb = new THREE.HemisphereLight(0xffffff, 0x33353f, 0.25); scene.add(amb);
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, {left:-180, right:180, top:180, bottom:-180, far:900});
  key.shadow.camera.updateProjectionMatrix(); key.shadow.bias = -0.0015; key.shadow.normalBias = 1.5;
  scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0x8fb8ff, 0); scene.add(rim); scene.add(rim.target);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000),
    new THREE.MeshLambertMaterial({color: 0x4a4d57}));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  scene.add(buildFigure());

  /* 指示物：渲取景图时整组藏掉 */
  const giz = new THREE.Group(); scene.add(giz);
  [60, 110, 170, 240].forEach(r => {
    const m = new THREE.Mesh(new THREE.RingGeometry(r-0.6, r+0.6, 96),
      new THREE.MeshBasicMaterial({color: 0x7b7f8c, transparent: true, opacity: 0.45}));
    m.rotation.x = -Math.PI/2; m.position.y = 0.1; giz.add(m);
  });
  [['正面',0,150],['背',0,-150],['右',150,0],['左',-150,0]].forEach(([t,x,z]) => {
    const {sp} = textSprite3D(t, 30); sp.position.set(x, 6, z); giz.add(sp);
  });

  /* 摄影机指示物 */
  const camG = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(16, 12, 22),
    new THREE.MeshPhongMaterial({color: 0x0a84ff, shininess: 40}));
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(5, 6.5, 12, 20),
    new THREE.MeshPhongMaterial({color: 0x0a84ff, shininess: 40}));
  lens.rotation.x = Math.PI/2; lens.position.z = -15;
  camG.add(body); camG.add(lens); giz.add(camG);
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(24), 3));
  const frustum = new THREE.LineSegments(fGeo,
    new THREE.LineBasicMaterial({color: 0x0a84ff, transparent: true, opacity: 0.35}));
  giz.add(frustum);

  /* 灯指示物 */
  const bulbMat = new THREE.MeshBasicMaterial({color: 0xffffff});
  const glowMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.18});
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(7, 20, 16), bulbMat);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(16, 20, 16), glowMat);
  giz.add(bulb); giz.add(glow);
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const lray = new THREE.Line(lGeo, new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.4}));
  giz.add(lray);

  const obs = new THREE.PerspectiveCamera(34, 1, 1, 4000);
  const shot = new THREE.PerspectiveCamera(40, 9/16, 1, 5000);

  ST3 = {renderer, scene, obs, shot, giz, key, rim, amb, camG, frustum,
         bulb, glow, lray, bulbMat, glowMat, vx: 20, vy: -26};
  return ST3;
}

/* 摄影机与灯在场上的位置 —— 和真实渲染同一套语义 */
const camPos = s => { const R = rigRadius(s.dist), rr = R * Math.cos(s.el * D2R);
  return new THREE.Vector3(rr * Math.sin(s.az * D2R), STAGE_EYE + R * Math.sin(s.el * D2R), rr * Math.cos(s.az * D2R)); };
const litPos = s => { const R = 150, rr = R * Math.cos(s.lightEl * D2R);
  return new THREE.Vector3(rr * Math.sin(s.lightAz * D2R), STAGE_EYE + R * Math.sin(s.lightEl * D2R), rr * Math.cos(s.lightAz * D2R)); };

function syncStage(s){
  const st = buildStage3D();
  const cp = camPos(s), lp = litPos(s);
  st.camG.position.copy(cp); st.camG.lookAt(0, STAGE_EYE, 0);

  const fp = st.frustum.geometry.attributes.position.array;
  const corners = [[-16,2],[16,2],[16,54],[-16,54]];
  corners.forEach(([x,y], i) => { fp[i*6]=cp.x; fp[i*6+1]=cp.y; fp[i*6+2]=cp.z;
    fp[i*6+3]=x; fp[i*6+4]=y; fp[i*6+5]=0; });
  st.frustum.geometry.attributes.position.needsUpdate = true;

  const kc = keyColor(s);
  st.key.position.copy(lp); st.key.target.position.set(0, STAGE_EYE, 0);
  st.key.color.copy(kc); st.key.intensity = 0.3 + (s.bright / 100) * 1.8;
  st.rim.position.set(-lp.x, Math.max(lp.y, STAGE_EYE), -lp.z); st.rim.target.position.set(0, STAGE_EYE, 0);
  st.rim.color.copy(rimColor(s)); st.rim.intensity = s.rim ? 1.2 : 0;
  st.amb.intensity = 0.1 + (s.ambient ?? 25) / 100 * 0.55;

  st.bulbMat.color.copy(kc); st.glowMat.color.copy(kc);
  st.bulb.position.copy(lp); st.glow.position.copy(lp);
  st.glow.scale.setScalar(0.7 + (s.bright / 100) * 0.9);
  const lp2 = st.lray.geometry.attributes.position.array;
  lp2[0]=lp.x; lp2[1]=lp.y; lp2[2]=lp.z; lp2[3]=0; lp2[4]=STAGE_EYE; lp2[5]=0;
  st.lray.geometry.attributes.position.needsUpdate = true;
  return st;
}

/* 舞台俯瞰 */
function renderStageView(s, canvas){
  if (!window.THREE || !canvas) return;
  const st = syncStage(s);
  st.giz.visible = true;
  const OD = 420, vx = st.vx * D2R, vy = st.vy * D2R;
  st.obs.position.set(OD*Math.sin(vy)*Math.cos(vx), 34 + OD*Math.sin(vx), OD*Math.cos(vy)*Math.cos(vx));
  st.obs.lookAt(0, 30, 0);
  st.renderer.setSize(canvas.width, canvas.height, false);
  st.obs.aspect = canvas.width / canvas.height; st.obs.updateProjectionMatrix();
  st.renderer.render(st.scene, st.obs);
  const g = canvas.getContext('2d');
  g.clearRect(0,0,canvas.width,canvas.height);
  g.drawImage(st.renderer.domElement, 0, 0, canvas.width, canvas.height);
}

/* 摄影机取景 —— 指示物全藏，所以这一帧可以直接当参考图 */
/* 相机定位：舞台指示、取景预览、姿态参考图三处共用同一套算法 */
function aimCam(s, cam){
  const mm = parseInt(s.mm, 10) || 50;
  const ar = ratioVal(s.ratio || '9:16');
  cam.fov = clamp(2 * Math.atan(sensorH(ar) / 2 / mm) * R2D, 6, 110);   // 视场角随画幅变，不能写死竖画幅
  cam.updateProjectionMatrix();
  /* 真实拍法：景别由距离档定，焦距变了人就往后站/往前凑 —— 取景不变，透视压缩变 */
  const R = (SHOT_R[Math.round(s.dist ?? 2)] || 109) * (mm / 50);
  const az = (s.az || 0) * D2R;
  const el = (s.angle === '顶拍' ? 85 : (s.el || 0)) * D2R;
  const ty = 38;                                            // 对准胸口，头顶自然留白
  cam.up.set(0, 1, 0);
  cam.position.set(R * Math.sin(az) * Math.cos(el), ty + R * Math.sin(el), R * Math.cos(az) * Math.cos(el));
  cam.lookAt(0, ty, 0);
  if (s.angle === '荷兰角') cam.rotateZ(8 * D2R);           // 真的滚转
}

function renderShot(s, canvas){
  if (!window.THREE || !canvas || !s) return;
  renderShotView(s, canvas.width, canvas.height, canvas);
}

/* 页面上所有实拍预览画布统一重绘 */
function paintShotPreviews(s){
  const t = s || rigTarget(); if (!t) return;
  document.querySelectorAll('canvas[data-shotprev]').forEach(c => renderShot(t, c));
}

function renderShotView(s, w, h, canvas){
  if (!window.THREE) return null;
  const st = syncStage(s);
  st.giz.visible = false;
  st.renderer.setSize(w, h, false);
  st.shot.aspect = w / h;
  aimCam(s, st.shot);
  st.renderer.render(st.scene, st.shot);
  let url = null;
  if (canvas){ const g = canvas.getContext('2d');
    g.clearRect(0,0,canvas.width,canvas.height);
    g.drawImage(st.renderer.domElement, 0, 0, canvas.width, canvas.height); }
  else { try { url = st.renderer.domElement.toDataURL('image/png'); } catch(e){} }
  st.giz.visible = true;
  return url;
}

/* 点选：拖摄影机还是拖灯，点到谁算谁；点空白沿用当前开关 */
function pickStage(ev, canvas, s){
  const st = buildStage3D();
  const r = canvas.getBoundingClientRect();
  const m = new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(m, st.obs);
  if (rc.intersectObject(st.camG, true).length) return 'cam';
  if (rc.intersectObject(st.bulb, true).length || rc.intersectObject(st.glow, true).length) return 'light';
  return null;
}

function bindStage(){
  const s = rigTarget(); if (!s) return;
  const canvas = document.getElementById('stagecanvas');
  if (!canvas){ return bind3D(); }
  renderStageView(s, canvas);
  paintShotPreviews(s);
  let on = false, px = 0, py = 0, a0 = 0, e0 = 0, who = 'cam';
  canvas.addEventListener('pointerdown', ev => {
    const hit = pickStage(ev, canvas, s);
    who = hit || A.stageSel || 'cam';
    if (hit && hit !== A.stageSel){ A.stageSel = hit;
      document.querySelectorAll('[data-stagesel]').forEach(b => b.setAttribute('aria-pressed', b.dataset.stagesel === hit));
      document.querySelectorAll('[data-grp]').forEach(g => g.setAttribute('data-on', String(g.dataset.grp === hit))); }
    on = true; canvas.setPointerCapture(ev.pointerId); canvas.style.cursor = 'grabbing';
    px = ev.clientX; py = ev.clientY;
    [a0, e0] = who === 'cam' ? [s.az, s.el] : [s.lightAz, s.lightEl];
  });
  canvas.addEventListener('pointermove', ev => {
    if (!on) return;
    const a = ((a0 + (ev.clientX - px) * 0.65 + 180) % 360 + 360) % 360 - 180;
    const e = e0 - (ev.clientY - py) * 0.45;
    if (who === 'cam'){ s.az = a; s.el = clamp(e, RIG.el.min, RIG.el.max); }
    else { s.lightAz = a; s.lightEl = clamp(e, -35, 65); }
    paintStage(s);
  });
  canvas.addEventListener('pointerup', () => { on = false; canvas.style.cursor = 'grab'; });
}

function paintStage(s){
  if (!s) return;
  s.size = distName(s.dist);                 // 无论走哪条渲染分支，景别名都要跟上
  const canvas = document.getElementById('stagecanvas');
  if (!canvas) return paintRig(s);
  renderStageView(s, canvas);
  paintShotPreviews(s);
  const hud = document.getElementById('stagehud');
  if (hud) hud.textContent = `${azName(s.az)} · ${elName(s.el)} → ${azFace(s.az)} ｜ ${lightName(s.lightAz,s.lightEl)}`;
  const term = document.getElementById('rigterm');
  if (term) term.textContent = `${distName(s.dist)} · ${s.mm} · ${s.fstop}`;
  document.querySelectorAll('[data-grp] .pgrp__h span').forEach(el => {
    const g = el.closest('[data-grp]').dataset.grp;
    el.textContent = g === 'cam' ? `${distName(s.dist)} · ${azName(s.az)} · ${elName(s.el)} → ${azFace(s.az)}`
      : `${lightName(s.lightAz,s.lightEl)} · ${kName(s.kelvin)}${s.rim?' · 轮廓光':''}`;
  });
  ['az','el','dist','bright','kelvin','ambient'].forEach(k => {
    const v = document.getElementById('v-'+k);
    if (v) v.textContent = Math.round(s[k] ?? 0) + (k==='bright'||k==='ambient'?'%':k==='kelvin'?'K':k==='dist'?'':'°');
    const r = document.querySelector(`[data-rig="${k}"]`); if (r) r.value = Math.round(s[k] ?? 0);
  });
}

/* ============================================================ Plot outline：左资源管理器 + 右选中预览 */

  const shotsOf = b => A.shots.filter(s => s.sc === b.k);

    : s.verdict==='redo' ? '<span class="pill pill--warn">重摇</span>' : '<span class="pill">未判定</span>';

    const withShots = a.beats.filter(b => shotsOf(b).length).length;
    return `<details class="expl__act" data-actgrp="${a.id}"${(A.expl||{})[a.id]===false?'':' open'}>

  const preview = !beat ? `<div class="blk"><div class="blk__body">

        <p class="t-cap dim" style="margin:0;line-height:1.7">这一场还没有镜头。去画布从 Story 节点拉一条线，就能在这里长出第一镜。</p>

/* 极简 markdown → 剧本排版 */
function md(t){
  return t.split('\n').map(l => {
    const s = l.trim();
    if (!s) return '';
    if (s.startsWith('## ')) return `<h3>${esc(s.slice(3))}</h3>`;
    if (s.startsWith('# '))  return `<h2>${esc(s.slice(2))}</h2>`;
    if (/^\*\*.+\*\*$/.test(s)) return `<div class="sc">${esc(s.replace(/\*\*/g,''))}</div>`;
    if (/^[^：""]+ · /.test(s) && s.length < 40) return `<div class="meta">${esc(s)}</div>`;
    if (/^(旁白|艾米|年糕)[：:]/.test(s)) return `<p class="ln">${esc(s)}</p>`;
    return `<p>${esc(s)}</p>`;
  }).join('');
}

/* ============================================================ Overview 画布（与流水线同源） */
A.cv = {
  tx: 20, ty: 10, zoom: 0.85, sel: null, pos: {}, confirmDel: null,
  pins: [
    {id:'CHAR-001', n:'艾米 · 4 视图'},
    {id:'CHAR-002', n:'年糕 · 4 视图'},
    {id:'PROP-001', n:'画本'},
    {id:'STYLE',    n:'画风基准'},
  ],
};

const NH = k => (k === 'image' || k === 'video') ? 150 : 68;

/* 画布不存自己的数据。每次都从 acts / shots 现算，所以两边永远一致 */
function cvGraph(){
  const nodes = [], edges = [];
  const beats = A.acts.flatMap(a => a.beats.map(b => ({...b, act:a})));
  const has = b => A.shots.some(s => s.sc === b.k);
  const put = (o) => { const p = A.cv.pos[o.id]; nodes.push(p ? {...o, x:p.x, y:p.y} : o); return o; };

  let y = 20;
  const built = beats.filter(has), empty = beats.filter(b => !has(b));

  built.forEach(b => {
    const list = A.shots.filter(s => s.sc === b.k);
    const y0 = y;
    list.forEach(s => {
      put({id:'img:'+s.id, k:'image', x:470, y, w:104, t:s.id, s:s.d, shot:s});
      if (s.vid !== 'none' || s.takes) put({id:'vid:'+s.id, k:'video', x:634, y, w:104, t:s.id, s:s.dur+'s', shot:s});
      edges.push(['sc:'+b.k, 'img:'+s.id]);
      if (s.vid !== 'none' || s.takes) edges.push(['img:'+s.id, 'vid:'+s.id]);
      y += NH('image') + 14;
    });
    put({id:'sc:'+b.k, k:'story', x:240, y:y0 + (y - y0 - 14)/2 - 34, w:186, t:b.k+' · '+b.t, s:b.act.t+' · '+list.length+' 镜', beat:b});
    edges.push(['idea', 'sc:'+b.k]);
  });

  empty.forEach(b => {
    put({id:'sc:'+b.k, k:'story', x:240, y, w:186, t:b.k+' · '+b.t, s:b.act.t+' · 尚无镜头', beat:b});
    edges.push(['idea', 'sc:'+b.k]);
    y += NH('story') + 14;
  });

  put({id:'idea', k:'idea', x:20, y:Math.max(20, y/2 - 34), w:186,
       t:'一个女孩发现，全世界都在遗忘她的猫', s:'一句话灵感'});

  return {nodes, edges, byId: Object.fromEntries(nodes.map(n => [n.id, n]))};
}

function viewCanvas(){

    const p = g.byId[a], q = g.byId[b]; if (!p || !q) return '';
    const x1 = p.x + p.w, y1 = p.y + NH(p.k)/2, x2 = q.x, y2 = q.y + NH(q.k)/2, m = (x1+x2)/2;
    return `<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="var(--color-border-strong)" stroke-width="1.5"/>

            const ok = p.id === 'STYLE' || (a && a.status === 'locked');
            return `<div class="cv__pinitem" data-pin="${p.id}" title="${ok?'拖到 Image 节点上绑定引用':'未定稿，不能绑定'}">

          <p class="t-cap dim" style="margin:12px 0 0;line-height:1.7">

            ${g.nodes.map(n => `<div class="cv-node cv-node--${n.k}" data-cv="${n.id}"
                aria-selected="${n.id===A.cv.sel}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px">
